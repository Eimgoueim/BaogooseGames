  /* ================= 肉鸽小游戏：宠物地牢（参考以撒的结合 · 5 层） ================= */
const RL = {
  on: false, raf: 0, last: 0, t: 0, wired: false,
  W: 176, H: 112, M: 16,                       // 画布逻辑尺寸 / 墙厚
  grid: 7, rooms: null, cur: '', start: [3, 3], chestTotal: 0, chestGot: 0,
  floor: 1, floors: 5,
  hp: 6, maxhp: 6, inv: 0,
  px: 88, py: 56, face: 's', fireCd: 0, keys: {},
  shots: [], picks: [], floats: [], foeShots: [],
  credits: 0, gold: 0, skills: [],
  bonus: { dmg: 1, cd: 0.3, speed: 160, spread: 1, pierce: 0, move: 62, size: 2 },
  clearedRooms: 0, kills: 0, msg: '', msgT: 0,
  over: false, win: false, ctx: null
};
const RL_CHEST_RATE = 0.6;                     // 普通宝箱出现概率（每间房）
const RL_CHEST_CREDITS = 10;                   // 普通宝箱 10 信用点
const RL_GOLD_RATE = 0.6;                      // 清完一间房的怪：60% 掉 1 金币
const RL_CLEAR_BONUS = 100;                    // 通关（打完第 5 层 BOSS）奖励 100 信用点
const RL_WELCOME = 1000;                       // 首次打开游戏赠送 1000 信用点
const RL_COST = 10;                            // 出战消耗精力
const RL_DIRS = ['n', 's', 'e', 'w'];
const RL_VEC = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
const RL_OPP = { n: 's', s: 'n', e: 'w', w: 'e' };
// 技能：加攻击效果 / 属性
const RL_SKILLS = [
  { key: 'dmg',    name: '力量',     type: '攻击', emoji: '💪', desc: '伤害 +1' },
  { key: 'rate',   name: '急速',     type: '射速', emoji: '⚡', desc: '射速大幅提升' },
  { key: 'triple', name: '三重射击', type: '弹幕', emoji: '🔱', desc: '一次打三发' },
  { key: 'pierce', name: '穿透',     type: '穿透', emoji: '📌', desc: '子弹可穿透敌人' },
  { key: 'fast',   name: '疾风',     type: '弹速', emoji: '👟', desc: '子弹更快更远' },
  { key: 'run',    name: '轻快',     type: '移速', emoji: '🎽', desc: '移动更快' },
  { key: 'hp',     name: '生命',     type: '生命', emoji: '❤️', desc: '最大生命 +1 并回满' },
  { key: 'big',    name: '巨弹',     type: '弹体', emoji: '⚫', desc: '子弹变大更好命中' }
];
function rlSkill(key) { return RL_SKILLS.filter(s => s.key === key)[0]; }
function rlApplySkill(key) {
  const b = RL.bonus;
  if (key === 'dmg') b.dmg += 1;
  else if (key === 'rate') b.cd = Math.max(0.12, b.cd * 0.68);
  else if (key === 'triple') b.spread = Math.min(3, b.spread + 1);
  else if (key === 'pierce') b.pierce += 1;
  else if (key === 'fast') b.speed += 60;
  else if (key === 'run') b.move += 18;
  else if (key === 'hp') { RL.maxhp += 1; RL.hp = RL.maxhp; }
  else if (key === 'big') b.size += 1;
  RL.skills.push(key);
}
function rlRandomSkill() { return RL_SKILLS[Math.floor(Math.random() * RL_SKILLS.length)].key; }

// 门口区域：怪不在这里待着（进来就被贴脸体验太差）
function rlDoorZones() {
  const W = RL.W, H = RL.H, pad = 22;
  return [
    { x: W / 2 - pad, y: 0, w: pad * 2, h: RL.M + 10 },              // 上门
    { x: W / 2 - pad, y: H - RL.M - 10, w: pad * 2, h: RL.M + 10 },  // 下门
    { x: 0, y: H / 2 - pad, w: RL.M + 10, h: pad * 2 },              // 左门
    { x: W - RL.M - 10, y: H / 2 - pad, w: RL.M + 10, h: pad * 2 }   // 右门
  ];
}
function rlNearDoor(x, y, extra) {
  const pad = extra || 0;
  return rlDoorZones().some(z => x > z.x - pad && x < z.x + z.w + pad && y > z.y - pad && y < z.y + z.h + pad);
}
function rlFill(x, y, w, h, c) { RL.ctx.fillStyle = c; RL.ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function rlK(x, y) { return x + ',' + y; }
function rlMsg(m) { RL.msg = m; RL.msgT = 2.8; }
function rlShopUI() {
  const box = el('rlShop');
  if (!box) return;
  const r = RL.rooms && RL.rooms[RL.cur];
  if (!RL.on || !r || r.type !== 'shop' || !r.shop) { box.className = 'rl-shop'; box.innerHTML = ''; return; }
  box.className = 'rl-shop on';
  box.innerHTML = r.shop.map((it, i) => {
    const t = (rlSkill(it.key) || {}).type || '道具';
    const near = Math.hypot(RL.px - (34 + i * 54), RL.py - (RL.H / 2 + 6)) < 18;
    return '<span class="chip' + (it.bought ? ' bought' : '') + (near ? ' near' : '') + '">' +
      t + ' <b>' + it.price + '🪙</b></span>';
  }).join('');
}
function rlHUD() {
  const t = el('rlTop'), m = el('rlMsg');
  if (t) {
    const sk = RL.skills.map(k => (rlSkill(k) || {}).emoji || '').join('');
    t.textContent = '🏢' + RL.floor + '/' + RL.floors + ' · ❤' + RL.hp + '/' + RL.maxhp + ' · 🪙' + RL.gold +
      ' · 🎁' + RL.chestGot + '/' + RL.chestTotal + (sk ? ' · ' + sk : '');
  }
  if (m) m.textContent = RL.msgT > 0 ? RL.msg : '';
}

function rlGen(floor) {                        // 生成一层：9~11 间 + 1 宝箱房 + 1 商店房 + 1 BOSS 房
  const rooms = {};
  const s = RL.start;
  const f = floor || 1;
  rooms[rlK(s[0], s[1])] = { x: s[0], y: s[1], doors: {}, type: 'start', foes: [], chest: false, dist: 0 };
  const total = 9 + Math.floor(Math.random() * 3);
  let guard = 0;
  while (Object.keys(rooms).length < total && guard++ < 800) {
    const list = Object.keys(rooms);
    const r = rooms[list[Math.floor(Math.random() * list.length)]];
    const d = RL_DIRS[Math.floor(Math.random() * 4)];
    const v = RL_VEC[d];
    const nx = r.x + v[0], ny = r.y + v[1];
    if (nx < 0 || ny < 0 || nx >= RL.grid || ny >= RL.grid) continue;
    if (!rooms[rlK(nx, ny)]) rooms[rlK(nx, ny)] = { x: nx, y: ny, doors: {}, type: 'monster', foes: [], chest: false, dist: 0 };
    r.doors[d] = true;
    rooms[rlK(nx, ny)].doors[RL_OPP[d]] = true;
  }
  // 邻近房间随机再连几条（像以撒那样出现环状通路）
  let extraLinks = 0;
  Object.keys(rooms).forEach(k => {
    const r0 = rooms[k];
    if (extraLinks >= 3) return;
    RL_DIRS.forEach(d => {
      if (extraLinks >= 3 || r0.doors[d]) return;
      const v0 = RL_VEC[d], nk = rlK(r0.x + v0[0], r0.y + v0[1]), nb = rooms[nk];
      if (!nb || nb.doors[RL_OPP[d]]) return;
      if (Math.random() < 0.16) { r0.doors[d] = true; nb.doors[RL_OPP[d]] = true; extraLinks++; }
    });
  });
  // BFS 距离 → 最远的是 BOSS 房
  const q = [[s[0], s[1]]];
  const seen = {}; seen[rlK(s[0], s[1])] = true;
  let far = [s[0], s[1]], farD = 0;
  while (q.length) {
    const cur = q.shift(), cr = rooms[rlK(cur[0], cur[1])];
    if (!cr) continue;
    if (cr.dist > farD) { farD = cr.dist; far = cur; }
    RL_DIRS.forEach(d => {
      if (!cr.doors[d]) return;
      const v = RL_VEC[d], nx = cr.x + v[0], ny = cr.y + v[1];
      const nk = rlK(nx, ny);
      if (!rooms[nk] || seen[nk]) return;
      seen[nk] = true; rooms[nk].dist = cr.dist + 1; q.push([nx, ny]);
    });
  }
  // 保险：把任何"从起点走不到"的房间删掉（避免地图上出现进不去的房间）
  Object.keys(rooms).forEach(k => {
    if (k !== rlK(s[0], s[1]) && !seen[k]) delete rooms[k];
  });
  Object.keys(rooms).forEach(k => {
    const r0 = rooms[k];
    RL_DIRS.forEach(d => {
      if (!r0.doors[d]) return;
      const v0 = RL_VEC[d];
      if (!rooms[rlK(r0.x + v0[0], r0.y + v0[1])]) delete r0.doors[d];
    });
  });
  rooms[rlK(far[0], far[1])].type = 'boss';
  // 宝箱房 / 商店房：从剩下的房间里挑两个（离起点别太近）
  const pool = Object.keys(rooms).filter(k => rooms[k].type === 'monster' && rooms[k].dist >= 2);
  const pick = () => { if (!pool.length) return null; return pool.splice(Math.floor(Math.random() * pool.length), 1)[0]; };
  const tk = pick() || pool.pop();
  if (tk) { rooms[tk].type = 'treasure'; rooms[tk].foes = []; }
  const sk = pick() || pool.pop();
  if (sk) { rooms[sk].type = 'shop'; rooms[sk].foes = []; }
  // 普通宝箱：每间房 60%
  RL.chestTotal = 0;
  Object.keys(rooms).forEach(k => {
    const r = rooms[k];
    if (r.type === 'boss' || r.type === 'treasure' || r.type === 'shop') return;
    r.chest = Math.random() < RL_CHEST_RATE;
    if (r.chest) RL.chestTotal++;
  });
  // 怪：越深越强（每层 +1 血、数量略增）
  const hpAdd = f - 1;
  Object.keys(rooms).forEach(k => {
    const r = rooms[k];
    if (r.type !== 'monster') { r.foes = r.foes || []; return; }
    const n = Math.min(2 + f + Math.floor((r.dist || 0) / 3) + (Math.random() < 0.35 ? 1 : 0), 6);   // 每层递增，第一层更友好
    for (let i = 0; i < n; i++) {
      const kind = r.dist >= 3 ? ['blob', 'fly', 'shooter'][Math.floor(Math.random() * 3)]
                               : ['blob', 'fly'][Math.floor(Math.random() * 2)];
      // 出生点避开门口和房间正中（宝箱/出生位置）
      let fx = 0, fy = 0;
      for (let tr = 0; tr < 24; tr++) {
        fx = 30 + Math.random() * (RL.W - 60);
        fy = 30 + Math.random() * (RL.H - 60);
        const farFromCenter = Math.hypot(fx - RL.W / 2, fy - RL.H / 2) > 26;
        if (!rlNearDoor(fx, fy, 4) && farFromCenter) break;
      }
      r.foes.push({ kind: kind, x: fx, y: fy,
                    hp: (kind === 'fly' ? 2 : 3) + hpAdd, t: Math.random() * 2, vx: 0, vy: 0, hit: 0 });
    }
  });
  return rooms;
}

function rlEnter(key, from) {
  const r = RL.rooms[key];
  if (!r) return;
  RL.cur = key;
  RL.shots = []; RL.foeShots = []; RL.picks = []; RL.floats = [];
  if (r.type === 'boss' && !r.spawned) {
    r.spawned = true;
    r.foes = [{ kind: 'boss', x: RL.W / 2, y: RL.H / 2 - 8, hp: 12 + 5 * (RL.floor - 1), t: 1.6, vx: 0, vy: 0, hit: 0 }];
  }
  if (r.type === 'shop' && !r.shop) {          // 商店：3 件技能，用金币买
    r.shop = [];
    for (let i = 0; i < 3; i++) {
      r.shop.push({ key: rlRandomSkill(), price: 3 + Math.floor(Math.random() * 3), bought: false });
    }
  }
  RL.grace = 0.8;                                            // 刚进门 0.8 秒不会被贴脸撞到
  const M = RL.M;
  // from = 玩家走的方向：从南边走进来，就出现在新房间的南门；从北边走就出现在北门
  if (from === 'n') { RL.px = RL.W / 2; RL.py = RL.H - M - 8; }        // 往上走 → 新房间下方门口
  else if (from === 's') { RL.px = RL.W / 2; RL.py = M + 8; }          // 往下走 → 新房间上方门口
  else if (from === 'w') { RL.px = RL.W - M - 8; RL.py = RL.H / 2; }   // 往左走 → 新房间右侧门口
  else if (from === 'e') { RL.px = M + 8; RL.py = RL.H / 2; }          // 往右走 → 新房间左侧门口
  else { RL.px = RL.W / 2; RL.py = RL.H / 2; }
  rlShopUI();                                            // 进/离开商店立刻刷新"类型+价格"
  rlMsg(r.type === 'boss' ? '👑 第 ' + RL.floor + ' 层 BOSS！'
    : r.type === 'treasure' ? '💎 宝箱房：金宝箱给技能'
    : r.type === 'shop' ? '🛒 商店：走到技能上用金币买'
    : r.type === 'start' ? '第 ' + RL.floor + ' 层起点'
    : '怪物房 · 剩 ' + r.foes.length);
}

function rlStart() {
  const p = P();
  if (!p) return;
  if (p.asleep) { toast('😴 它睡着了，先叫醒它再出战'); return; }
  if (p.energy < RL_COST) { toast('⚡ 精力不够（需要 ' + RL_COST + '），先让它休息一下'); return; }
  const cv = el('rlCanvas');
  if (!cv || typeof cv.getContext !== 'function') { toast('⚠️ 这台设备画不了地牢'); return; }
  RL.ctx = cv.getContext('2d');
  rlWire(cv);
  rlGoFullscreen();
  p.energy = clamp(p.energy - RL_COST);
  RL.floor = 1; RL.hp = RL.maxhp = 6;
  RL.inv = 0; RL.credits = 0; RL.gold = 0; RL.skills = [];
  RL.bonus = { dmg: 1, cd: 0.3, speed: 160, spread: 1, pierce: 0, move: 62, size: 2 };
  RL.clearedRooms = 0; RL.kills = 0; RL.chestGot = 0;
  RL.over = false; RL.win = false; RL.msgT = 0; RL.t = 0;
  RL.shots = []; RL.foeShots = []; RL.picks = []; RL.floats = []; RL.keys = {}; RL.fireCd = 0;
  RL.rooms = rlGen(1);
  rlEnter(rlK(RL.start[0], RL.start[1]), '');
  rlShopUI();
  closeOtherPanels('rlOverlay');
  uiTab = '';
  el('rlOverlay').classList.add('open');
  el('rlMsg').textContent = '';
  el('rlHint').textContent = 'WASD 移动 · 方向键/IJKL 射击 · 鼠标点击也能打 · 宝箱给信用点，金宝箱给技能，商店用金币买技能' +
    (rlPad() ? ' · 🎮 手柄已连接' : ' · 手柄：左摇杆移动 / 右摇杆射击');
  rlHUD();
  render();
  RL.on = true; RL.last = 0;
  if (typeof requestAnimationFrame === 'function' && !RL.raf) RL.raf = requestAnimationFrame(rlLoop);
  toast('🎲 出战！5 层地牢，打完第 5 层 BOSS 通关奖励 💰' + RL_CLEAR_BONUS);
}

function rlNextFloor() {
  RL.floor++;
  RL.rooms = rlGen(RL.floor);
  rlEnter(rlK(RL.start[0], RL.start[1]), '');
  rlMsg('⬇️ 进入第 ' + RL.floor + ' 层！');
  save();
}

function rlFinish(win) {
  RL.on = false; RL.over = true; RL.win = !!win;
  if (RL.raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(RL.raf);
  RL.raf = 0; RL.keys = {};
  const p = P();
  if (p) addAffinity(win ? 5 : 2);
  if (win) {
    state.coins += RL_CLEAR_BONUS;                        // 打通 5 层奖励 100 信用点
    gainPoints(40, 0, 16);
    toast('🏆 通关 5 层！信用点 +' + RL_CLEAR_BONUS);
  } else {
    gainPoints(Math.max(4, Math.floor(RL.credits / 2)), 0, 5);
  }
  save(); render();
  const h = el('rlMsg');
  if (h) {
    h.textContent = (win ? '🏆 通关 5 层！' : '💀 在第 ' + RL.floor + ' 层倒下了…') +
      ' 宝箱 ' + RL.chestGot + '/' + RL.chestTotal + ' · 拾取 💰' + RL.credits + ' · 🪙' + RL.gold +
      ' · 技能 ' + RL.skills.length + ' · 击杀 ' + RL.kills +
      (win ? ' · 通关奖励 💰' + RL_CLEAR_BONUS : '（信用点已入账）');
  }
  rlHUD();
}

function rlGoFullscreen() {
  try {
    if (typeof document === 'undefined') return;
    const e = document.documentElement;
    if (!document.fullscreenElement && e && e.requestFullscreen) e.requestFullscreen();
  } catch (err) {}
}
function rlExitFullscreen() {
  try {
    if (typeof document !== 'undefined' && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  } catch (err) {}
}
function rlClose() {
  const sb = el('rlShop');
  if (sb) { sb.className = 'rl-shop'; sb.innerHTML = ''; }
  rlExitFullscreen();
  RL.on = false; RL.over = true; RL.keys = {};
  if (RL.raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(RL.raf);
  RL.raf = 0;
  el('rlOverlay').classList.remove('open');
  paintUseBar();
}

function rlHurt(n) {
  if (RL.inv > 0 || RL.over) return;
  RL.hp -= n; RL.inv = 0.9;
  if (RL.hp <= 0) { RL.hp = 0; rlFinish(false); }
}
function rlFire(dx, dy) {                                // 按方向开火（键盘/鼠标/手柄共用）
  if (RL.fireCd > 0 || RL.over) return;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  if (!dx && !dy) dy = 1;
  RL.fireCd = RL.bonus.cd;
  const M2 = RL.M + 2;
  const base = Math.atan2(dy, dx);
  const n = RL.bonus.spread;
  for (let i = 0; i < n; i++) {
    const a = base + (n === 1 ? 0 : (i - (n - 1) / 2) * 0.22);
    const vx = Math.cos(a), vy = Math.sin(a);
    RL.shots.push({
      x: Math.max(M2, Math.min(RL.W - M2, RL.px + vx * 8)),
      y: Math.max(M2, Math.min(RL.H - M2, RL.py - 4 + vy * 8)),
      vx: vx * RL.bonus.speed, vy: vy * RL.bonus.speed,
      dmg: RL.bonus.dmg, pierce: RL.bonus.pierce, size: RL.bonus.size, life: 1.6
    });
  }
  RL.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'e' : 'w') : (dy > 0 ? 's' : 'n');
}
function rlShoot(tx, ty) { rlFire(tx - RL.px, (ty - 4) - RL.py); }
// 手柄：左摇杆/十字键移动，右摇杆或 ABXY 射击，Start/Select 退出
function rlPad() {
  try {
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return null;
    const gs = navigator.getGamepads();
    for (let i = 0; i < gs.length; i++) if (gs[i] && gs[i].connected !== false) return gs[i];
  } catch (e) {}
  return null;
}
function rlPadMove() {
  const g = rlPad(), out = { x: 0, y: 0, fire: null, exit: false, on: false };
  if (!g) return out;
  out.on = true;
  const dz = v => (Math.abs(v || 0) > 0.25 ? v : 0);
  const ax = g.axes || [], bt = g.buttons || [];
  const pressed = i => !!(bt[i] && (bt[i] === true || bt[i].pressed));
  out.x = dz(ax[0]); out.y = dz(ax[1]);
  if (pressed(14)) out.x = -1;
  if (pressed(15)) out.x = 1;
  if (pressed(12)) out.y = -1;
  if (pressed(13)) out.y = 1;
  let sx = dz(ax[2]), sy = dz(ax[3]);
  if (!sx && !sy) {                                      // 右摇杆没推 → ABXY 当四向射击
    if (pressed(3)) sx = 1;
    if (pressed(1)) sx = -1;
    if (pressed(0)) sy = 1;
    if (pressed(2)) sy = -1;
  }
  if (sx || sy) out.fire = { x: sx, y: sy };
  out.exit = pressed(9) || pressed(8);
  return out;
}
function rlGainSkill(key) {
  rlApplySkill(key);
  const s = rlSkill(key);
  rlMsg('✨ 获得技能：' + s.emoji + ' ' + s.name + '（' + s.desc + '）');
  RL.floats.push({ x: RL.px, y: RL.py - 20, text: s.emoji, life: 1.6 });
  rlHUD();
}
function rlKill(f) {
  RL.kills++;
  RL.floats.push({ x: f.x, y: f.y, text: 'boom', life: 0.5 });
  const roll = Math.random();
  if (roll < 0.22) RL.picks.push({ x: f.x, y: f.y, kind: 'heart' });
  else if (roll < 0.34) RL.picks.push({ x: f.x, y: f.y, kind: 'gold' });   // 小概率直接掉金币
}

function rlUpdate(dt) {
  if (RL.over) return;
  const r = RL.rooms[RL.cur];
  if (!r) return;
  const M = RL.M;
  if (RL.msgT > 0) RL.msgT -= dt;
  if (RL.grace > 0) RL.grace -= dt;
  if (RL.inv > 0) RL.inv -= dt;
  if (RL.fireCd > 0) RL.fireCd -= dt;
  const K = RL.keys;
  const pad = rlPadMove();
  if (pad.exit) { rlClose(); return; }
  let mx = 0, my = 0;                                      // 移动：WASD / 左摇杆 / 十字键
  if (K.a) mx -= 1;
  if (K.d) mx += 1;
  if (K.w) my -= 1;
  if (K.s) my += 1;
  mx += pad.x; my += pad.y;
  const len = Math.hypot(mx, my) || 1;
  RL.px += mx / len * RL.bonus.move * dt;
  RL.py += my / len * RL.bonus.move * dt;
  if (mx || my) RL.face = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 'e' : 'w') : (my > 0 ? 's' : 'n');
  RL.px = Math.max(M, Math.min(RL.W - M, RL.px));
  RL.py = Math.max(M, Math.min(RL.H - M, RL.py));
  // 门口 / 陷阱门
  const cleared = r.foes.length === 0;
  const nearX = Math.abs(RL.px - RL.W / 2) < 11, nearY = Math.abs(RL.py - RL.H / 2) < 11;
  if (r.trapdoor && Math.hypot(RL.px - r.trapdoor.x, RL.py - r.trapdoor.y) < 12) {
    rlNextFloor(); rlHUD(); return;
  }
  if (cleared) {
    let go = '';
    if (r.doors.n && RL.py <= M + 0.5 && nearX) go = 'n';
    else if (r.doors.s && RL.py >= RL.H - M - 0.5 && nearX) go = 's';
    else if (r.doors.w && RL.px <= M + 0.5 && nearY) go = 'w';
    else if (r.doors.e && RL.px >= RL.W - M - 0.5 && nearY) go = 'e';
    if (go) {
      const v = RL_VEC[go];
      const nk = rlK(r.x + v[0], r.y + v[1]);
      if (RL.rooms[nk]) {
        if (r.type === 'monster' && !r.done) {
          r.done = true; RL.clearedRooms++; gainPoints(2, 0, 1);
          if (Math.random() < RL_GOLD_RATE) {                      // 清光小怪：60% 掉 1 金币（直接入账）
            RL.gold++;
            RL.floats.push({ x: RL.W / 2, y: RL.H / 2 + 12, text: 'gold', life: 1.2 });
            rlMsg('🪙 清光房间 +1 金币（共 ' + RL.gold + '）');
          }
        }
        rlEnter(nk, go);
        rlHUD(); return;
      }
    }
  } else if (RL.py <= M + 1 || RL.py >= RL.H - M - 1 || RL.px <= M + 1 || RL.px >= RL.W - M - 1) {
    if (RL.msgT <= 0) rlMsg('🚪 先清光房间里的怪（还剩 ' + r.foes.length + '）');
  }
  // 射击：方向键 / IJKL（以撒手感）、空格、鼠标、手柄
  let sx = 0, sy = 0;
  if (K.arrowleft || K.j) sx -= 1;
  if (K.arrowright || K.l) sx += 1;
  if (K.arrowup || K.i) sy -= 1;
  if (K.arrowdown || K.k) sy += 1;
  if (sx || sy) rlFire(sx, sy);
  else if (pad.fire) rlFire(pad.fire.x, pad.fire.y);
  else if (K[' '] || K.space) { const d = RL_VEC[RL.face] || [0, 1]; rlFire(d[0], d[1]); }
  else if (K.mouse && K.mx !== undefined) rlShoot(K.mx, K.my);
  // 自己的眼泪
  RL.shots = RL.shots.filter(s => {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < M - 6 || s.x > RL.W - M + 6 || s.y < M - 6 || s.y > RL.H - M + 6) return false;
    for (let i = 0; i < r.foes.length; i++) {
      const f = r.foes[i];
      const rad = (f.kind === 'boss' ? 13 : 8) + (s.size || 2);
      if (Math.hypot(s.x - f.x, s.y - f.y) < rad) {
        f.hp -= s.dmg; f.hit = 0.12;
        if (s.pierce > 0) { s.pierce--; return true; }
        return false;
      }
    }
    return true;
  });
  // 敌人
  r.foes = r.foes.filter(f => {
    if (f.hit > 0) f.hit -= dt;
    f.t -= dt;
    const dx = RL.px - f.x, dy = RL.py - f.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (f.kind === 'blob') { f.x += dx / dist * 26 * dt; f.y += dy / dist * 26 * dt; }
    else if (f.kind === 'fly') {
      if (!f.vx && !f.vy) { const a = Math.random() * Math.PI * 2; f.vx = Math.cos(a) * 48; f.vy = Math.sin(a) * 48; }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < M + 3 || f.x > RL.W - M - 3) f.vx *= -1;
      if (f.y < M + 3 || f.y > RL.H - M - 3) f.vy *= -1;
      f.x = Math.max(M + 3, Math.min(RL.W - M - 3, f.x));
      f.y = Math.max(M + 3, Math.min(RL.H - M - 3, f.y));
    } else if (f.kind === 'shooter') {
      if (f.t <= 0) {
        f.t = 2;
        const a = Math.atan2(dy, dx);
        RL.foeShots.push({ x: f.x, y: f.y, vx: Math.cos(a) * 74, vy: Math.sin(a) * 74, life: 3 });
      }
    } else if (f.kind === 'boss') {
      f.x += dx / dist * 20 * dt; f.y += dy / dist * 20 * dt;
      if (f.t <= 0) {
        f.t = 2.4;
        const cnt = RL.floor >= 3 ? 6 : 5;                     // 前两层 5 向，后面 6 向
        const spd = RL.floor >= 3 ? 60 : 52;
        for (let k = 0; k < cnt; k++) {
          const a = (k / cnt) * Math.PI * 2 + RL.t;
          RL.foeShots.push({ x: f.x, y: f.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 3 });
        }
      }
    }
    // 门口区域：把怪往外推，别堵门
    if (rlNearDoor(f.x, f.y, 0)) {
      const cx = RL.W / 2, cy = RL.H / 2;
      const dx2 = cx - f.x, dy2 = cy - f.y, dl = Math.hypot(dx2, dy2) || 1;
      f.x += dx2 / dl * 40 * dt;
      f.y += dy2 / dl * 40 * dt;
    }
    f.x = Math.max(M + 4, Math.min(RL.W - M - 4, f.x));
    f.y = Math.max(M + 4, Math.min(RL.H - M - 4, f.y));
    const hitR = f.kind === 'boss' ? 15 : 10;
    if (RL.grace <= 0 && Math.hypot(RL.px - f.x, RL.py - f.y) < hitR) rlHurt(1);
    if (f.hp <= 0) { rlKill(f); return false; }
    return true;
  });
  // 敌人的眼泪
  RL.foeShots = RL.foeShots.filter(s => {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) return false;
    if (s.x < 4 || s.x > RL.W - 4 || s.y < 4 || s.y > RL.H - 4) return false;
    if (Math.hypot(RL.px - s.x, (RL.py - 4) - s.y) < 8) { rlHurt(1); return false; }
    return true;
  });
  // 普通宝箱：大概率信用点，也可能掉回血 / 金币
  if (r.chest && Math.hypot(RL.px - RL.W / 2, RL.py - (RL.H / 2 + 6)) < 14) {
    r.chest = false;
    RL.chestGot++;
    const roll = Math.random();
    if (roll < 0.55) {                                    // 55%：信用点
      RL.credits += RL_CHEST_CREDITS;
      state.coins += RL_CHEST_CREDITS;
      RL.floats.push({ x: RL.W / 2, y: RL.H / 2 + 2, text: '+' + RL_CHEST_CREDITS, life: 1.4 });
      rlMsg('🎁 宝箱 +' + RL_CHEST_CREDITS + ' 信用点');
    } else if (roll < 0.78 && RL.hp < RL.maxhp) {         // 23%：回血
      RL.hp = Math.min(RL.maxhp, RL.hp + 1);
      RL.floats.push({ x: RL.W / 2, y: RL.H / 2 + 2, text: 'heart', life: 1.4 });
      rlMsg('🎁 宝箱：回血 +1（❤' + RL.hp + '/' + RL.maxhp + '）');
    } else {                                              // 其余：金币
      RL.gold++;
      RL.floats.push({ x: RL.W / 2, y: RL.H / 2 + 2, text: 'gold', life: 1.4 });
      rlMsg('🎁 宝箱：金币 +1（🪙' + RL.gold + '）');
    }
    rlHUD(); save();
  }
  // 宝箱房：金宝箱给技能
  if (r.type === 'treasure' && !r.skillGot && Math.hypot(RL.px - RL.W / 2, RL.py - (RL.H / 2 + 6)) < 16) {
    r.skillGot = true;
    rlGainSkill(rlRandomSkill());
    RL.floats.push({ x: RL.W / 2, y: RL.H / 2, text: 'SKILL', life: 1.4 });
    save();
  }
  // 商店：走到技能上，用金币买
  if (r.type === 'shop' && r.shop) {
    r.shop.forEach((it, i) => {
      if (it.bought) return;
      const ix = 34 + i * 54, iy = RL.H / 2 + 6;
      if (Math.hypot(RL.px - ix, RL.py - iy) < 13) {
        if (RL.gold >= it.price) {
          RL.gold -= it.price; it.bought = true;
          rlGainSkill(it.key);
          rlShopUI();
        } else if (RL.msgT <= 0) {
          rlMsg('🪙 金币不够：' + (rlSkill(it.key) || {}).name + ' 需要 ' + it.price + ' 金币（清房间会掉金币）');
        }
      }
    });
  }
  // 拾取物
  RL.picks = RL.picks.filter(k => {
    if (Math.hypot(RL.px - k.x, (RL.py - 4) - k.y) < 10) {
      if (k.kind === 'gold') { RL.gold++; rlMsg('🪙 +1 金币（共 ' + RL.gold + '）'); }
      else { RL.hp = Math.min(RL.maxhp, RL.hp + 1); RL.floats.push({ x: k.x, y: k.y, text: 'heart', life: 1 }); }
      rlHUD(); return false;
    }
    return true;
  });
  RL.floats = RL.floats.filter(f => { f.y -= 14 * dt; f.life -= dt; return f.life > 0; });
  // BOSS 打完：前 4 层出陷阱门下下一层，第 5 层通关
  if (r.type === 'boss' && !r.bossDone && r.foes.length === 0 && r.spawned) {
    r.bossDone = true;
    if (RL.floor < RL.floors) {
      r.trapdoor = { x: RL.W / 2, y: RL.H / 2 };
      rlMsg('⬇️ 出现陷阱门，走过去进入第 ' + (RL.floor + 1) + ' 层');
    } else {
      rlFinish(true);
      return;

function rlWire(cv) {

  RL.wired = true;
  window.addEventListener('keydown', ev => {
    if (!RL.on) return;
    const k = String(ev.key || '').toLowerCase();
    if (k === 'escape') { rlClose(); return; }
    RL.keys[k] = true;
    if (ev.preventDefault && (k === ' ' || k.indexOf('arrow') === 0)) ev.preventDefault();
  });
  window.addEventListener('keyup', ev => {
    if (!RL.on) return;

  });

    const pos = ev => {

      return { x: ((ev.clientX - (rc ? rc.left : 0)) / (w / RL.W)), y: ((ev.clientY - (rc ? rc.top : 0)) / (h / RL.H)) };

    cv.addEventListener('pointerup', ev => { if (!RL.on) return; RL.keys.mouse = false; });
    cv.addEventListener('pointerleave', ev => { if (!RL.on) return; RL.keys.mouse = false; });

          '<div class="binfo"><div class="bnm">' + b.emoji + ' ' + b.name +
            (cur ? '<span class="bcur">当前</span>' : '') +

            (inTeam ? '<span class="lock">养成中</span>' : '') + '</div>' +

          (owned && !inTeam
            ? '<button class="btn tiny ba" data-action="adoptpick:' + k + '">领养</button>'

        '</div>';
      });
      const dk = decoKeys();

      html += '<div class="item"><div class="ico">🎀</div><div class="info"><div class="nm">' +

  /* ================= 事件 ================= */
  function handle(action, arg) {
    try {
      switch (action) {
        case 'play':  return play();
        case 'bath':  return bath();
        case 'sleep': return toggleSleep();
        case 'work':  return work();
        case 'tap':   return tap();
        case 'ans':   return answerMath(arg);
        case 'mole':  return hitMole(Number(arg));
        case 'simon': return tapSimon(Number(arg));
        case 'mini':  return startGame('disc');
        case 'adopt': return openAdopt();                  // 顶部 🐾：再点收起
        case 'adoptopen': return openAdopt(true);          // 「＋」/按钮：只打开（修：以前会误关）
        case 'adoptpick': return adopt(arg);
        case 'adoptclose': return closeAdopt();
        case 'switch': return switchPet(Number(arg));
        case 'pull':  return pull(Number(arg));
        case 'gachaclose': return closeGacha();
        case 'redeem': return redeem(arg);
        case 'wear': {
          const it = WEAR[arg];
          if (!it) return;
          const pw = P();
          if (!state.wear[arg]) { toast('还没有「' + it.name + '」，先去商店买或者抽卡'); return; }
          if (!pw.worn) pw.worn = {};
          if (pw.worn[it.slot] === arg) { delete pw.worn[it.slot]; toast('已脱下 ' + it.name); }
          else { pw.worn[it.slot] = arg; toast('🎀 ' + pw.name + ' 戴上了 ' + it.name); }
          render(); save();
          return;
        }
        case 'pet':   return petPet();
        case 'edit':
          state.edit = !state.edit;
          if (!state.edit) { state.sel = ''; PX.drag = null; }
          toast(state.edit ? '🛋️ 布置模式：拖动家具摆放位置，滚轮或滑块调大小' : '✅ 布置完成，已保存');
          render(); save(); return;
        case 'sel':
          state.edit = true;
          if (!pxOwned(arg)) { toast('还没有这件家具/装饰品，先去商店买或者抽卡'); return; }
          if (!state.placed) state.placed = {};
          if (state.placed[arg]) { state.sel = arg; }
          else if (pxAdd(arg)) { state.sel = arg; toast('已放到房间里，拖动调整位置'); }
          render(); save(); return;
        case 'scl':
          if (pxScale(Number(arg))) { toast('大小 ' + Math.round(state.placed[state.sel].s * 100) + '%'); render(); save(); }
          return;

        case 'furnback':
          if (pxDel(arg)) { toast('已收回房间家具'); render(); save(); }
          return;
        case 'furnedit':
          state.edit = true;
          render(); save(); return;
        case 'tb':
          if (arg === 'feed') { uiTab = 'bag'; render(); return; }
          if (arg === 'play') return play();
          if (arg === 'pet') return petPet();
          return;
        case 'banner': state.banner = BANNERS.some(b => b.key === arg) ? arg : state.banner;
                       render(); save(); return;
        case 'savepanel': return openSavePanel();
        case 'themeopen': {
          const tOv = el('themeOverlay');
          if (tOv && tOv.classList && tOv.classList.contains && tOv.classList.contains('open')) {   // 再点一下收起
            tOv.classList.remove('open'); paintUseBar(); return;
          }
          uiTab = '';                                         // 收起上一页（旧白框）
          closeOtherPanels('themeOverlay');
          tOv.classList.add('open');
  paintUseBar();
          const box = el('accentInput');
          if (box) {
            box.value = state.accent || (THEMES[state.theme] || THEMES[THEME_KEYS[0]]).vars['--purple'];
            if (!accentWired && box.addEventListener) {
              accentWired = true;
              box.addEventListener('input', () => {
                const v = String(box.value || '').trim();
                if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
                state.accent = v.toLowerCase();
                applyTheme(state.theme);
                render();
              });
            }
          }
          render();
          return;
        }
        case 'themeclose': el('themeOverlay').classList.remove('open'); paintUseBar(); return;
        case 'theme': {
          const k = THEMES[arg] ? arg : THEME_KEYS[0];
          state.theme = k;
          applyTheme(k);
          toast('🎨 已切换到「' + THEMES[k].name + '」');
          render(); save();
          return;
        }
        case 'accentapply': {
          const box = el('accentInput');
          const v = box && typeof box.value === 'string' ? box.value.trim() : '';
          if (!/^#[0-9a-fA-F]{6}$/.test(v)) { toast('请先在色块里选一个颜色'); return; }
          state.accent = v.toLowerCase();
          applyTheme(state.theme);
          toast('🧡 自定义主色：' + state.accent);
          render(); save();
          return;
        }
        case 'accentclear':
          state.accent = '';
          applyTheme(state.theme);
          toast('已恢复该风格的默认配色');
          render(); save();
          return;
        case 'saveclose': return closeSavePanel();
        case 'savenow': return saveNow();
        case 'saveexport': return exportSave();
        case 'savecopy': return copySave();
        case 'savedownload': return downloadSave();
        case 'saveimport': return importSave();
        case 'dlgok': return dialogOk();
        case 'dlgcancel': return closeDialog();
        case 'feed':  uiTab = 'bag'; render(); toast('🎒 打开背包，选择要喂的东西'); return;
        case 'feedbest': return feedBest();
        case 'hub':       return rlStart();                  // 🎮 出战：宠物地牢（肉鸽）
        case 'rlclose':   return rlClose();
        case 'rlrestart': return rlStart();
        case 'useleft':  return useShift(-1);
        case 'useright': return useShift(1);
        case 'buy':   return buy(arg);
        case 'use':   return useItem(arg);
        case 'tab':   return openPage(arg);
        case 'page':  return openPage(arg);
        case 'pageclose': return closePage();
        case 'rename': {
          const p = P();
          openDialog({
            title: '给「' + p.name + '」改名', body: '输入 1-8 个字：', input: true, value: p.name,
            confirmText: '保存',
            onConfirm: v => {
              const n = String(v || '').trim().slice(0, 8);
              if (!n) { toast('名字不能为空'); return; }
              p.name = n;
              toast('以后就叫你「' + n + '」啦');
              render(); save();
            }
          });
          return;
        }
        case 'reset': {
          openDialog({
            title: '重新开始', body: '确定要清空全部进度吗？（宠物、信用点、积分、图鉴都会重置）',
            confirmText: '确认重开',
            onConfirm: () => {
              state = defaultState();
              try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OLD_KEY); } catch (e) {}
              toast('🐣 新的小家伙出生啦！');
              render(); save();
            }
          });
          return;
        }
      }
    } catch (err) {
      toast('⚠️ 操作出错：' + (err && err.message ? err.message : err));
    }
  }

  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-action]');
    if (!t || t.disabled) return;
    // 拖动过视角就不要顺带触发抚摸
    if (t.dataset.action === 'pet' && dragMoved) { dragMoved = false; return; }
    const parts = t.dataset.action.split(':');
    handle(parts[0], parts[1]);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && dlgState && dlgState.input) dialogOk();
  });

  /* ================= 启动 ================= */
  function boot() {
    checkStorage();
    const had = load();
    const msg = had ? applyOffline() : null;
    if (!had) state = defaultState();
    if (!state.welcome) {                                  // 首次打开：欢迎奖励 1000 信用点
      state.welcome = true;
      state.coins += RL_WELCOME;
      toast('🎁 欢迎！首次打开赠送 ' + RL_WELCOME + ' 信用点');
    }
    camYaw = Number(state.camYaw) || 0;
    camZoom = Number(state.camZoom) || 1;
    if (typeof Image === 'function') probeImages();
    render();
    if (msg) toast(msg);
    if (!storageOK) toast('⚠️ 浏览器禁止本地存储，进度无法自动保存，请到「💾 存档」导出备份');
    // 像素 LCD 渲染器：启动即开帧循环（Canvas 2D 必定可用）
    try { pxStart(); } catch (e) { PX.err = String(e); }
    render();
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', function () { if (PX.ctx) { try { pxResize(); pxDraw(); } catch (e) {} } });
    }
    if (isSick(P())) toast('🤒 ' + P().name + ' 生病了，快用活力药水或让它睡觉');
    if (state.pets.length > 1) {
      const hungry = state.pets.filter(q => q.hunger < 25);
      if (hungry.length) toast('🍽️ 有 ' + hungry.length + ' 只宠物饿坏了（点上方头像切换）');
    }
    if (!had) openAdopt();
    save();                                  // 启动即落盘，避免刷新后进度回退
    setInterval(tick, TICK_MS);
    setInterval(function () {                              // 看门狗：帧循环若停摆则自动拉起
      if (PX.ctx && !PX.raf && typeof requestAnimationFrame === 'function') {
        try { PX.raf = requestAnimationFrame(pxLoop); } catch (e) {}
      }
    }, 2000);
    setInterval(save, 10000);
    window.addEventListener('beforeunload', save);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  }

  boot();
})();
</script>
</body>
</html>
