<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐾 小宠物养成 · 抽卡 & 三宠同养</title>
<style>
  :root{
    --ink:#2c2b3d; --muted:#7c7b92; --card:#ffffff;
    --pink:#ff8fb1; --purple:#8b7bff; --mint:#4fc9a8; --amber:#ffb340; --red:#ff6b6b;
    --ds:#4d6bfe; --ds2:#7fa8ff;
    --line:#eceaf6; --line2:#e6e2f7;
    --bg1:#eef2ff; --bg2:#fdf2f8; --bg3:#ecfeff;
    --soft:#faf9ff; --btn:#f4f2fd; --track:#f0eef9;
    --accent:#8b7bff;
    --shadow:0 10px 30px rgba(96,84,180,.10);
    --gloss:inset 0 1px 0 rgba(255,255,255,.55);
    --zh:var(--purple); --zh2:var(--pink);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    min-height:100vh; -webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .3s ease;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.12;
    background:radial-gradient(760px 520px at 16% -8%, var(--purple), transparent 62%),
               radial-gradient(620px 460px at 92% 4%, var(--pink), transparent 60%);
  }
  html,body{height:100%;overflow:hidden}
  .wrap{position:relative;z-index:1;width:100%;margin:0;padding:0}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand{
    font-size:23px;font-weight:900;letter-spacing:.6px;
    background:linear-gradient(120deg,var(--purple),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 6px rgba(139,123,255,.28));
  }
  .top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:13.5px;font-weight:700;
    box-shadow:var(--shadow), var(--gloss);
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--purple)}

  /* ---------- 布局 ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:920px){ .grid{grid-template-columns:1fr} }
  .card{
    background:var(--card);border-radius:26px;padding:16px;
    box-shadow:var(--shadow), 0 1px 3px rgba(30,20,70,.04);
    border:1px solid var(--line);position:relative;
  }
  .card::before{
    content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);opacity:.7;pointer-events:none;
  }

  /* ---------- 宠物槽 ---------- */
  .slots-float .pet-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0;justify-content:end}
  @media (max-width:560px){ .pet-slots{grid-template-columns:repeat(3,1fr)} }
  .slots-float .slots-head{font-size:9.5px;color:#f2ecff;font-weight:800;text-align:right;margin:0 1px 3px;letter-spacing:.2px}
  .slot{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 5px;
    border-radius:16px;background:var(--soft);border:1.5px solid var(--line2);cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .22s ease,border-color .2s;
    min-height:96px;justify-content:center;
  }
  .slot:hover{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 10px 20px rgba(96,84,180,.16)}
  .slot.cur{background:var(--btn);border-color:transparent;box-shadow:0 0 0 2px var(--purple),0 10px 22px rgba(96,84,180,.22)}
  .slot.warn{border-color:#ffcf8a;background:rgba(255,179,64,.14);box-shadow:0 0 0 2px rgba(255,179,64,.18)}
  .slot.empty{min-height:64px;padding:4px;border-style:dashed;color:var(--muted);font-size:11.5px;font-weight:700;gap:5px}
  .slot.locked{opacity:.45;filter:grayscale(.8);cursor:not-allowed}
  .slot.locked em{font-size:15px}
  .slot.empty em{font-style:normal;font-size:20px}
  .slot .sart{height:40px;display:flex;align-items:flex-end;justify-content:center}
  .slot .sart svg{width:40px;height:auto}
  .slot .sart img{width:40px;height:auto}
  .slot .sart .emo{font-size:26px;line-height:1}
  .slot .snm{font-size:11.5px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .slv{font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .slot .sbar{width:92%;height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
  .slot .sbar i{display:block;height:100%;border-radius:999px;background:var(--mint);transition:width .35s ease}
  .slot .lim{position:absolute;top:5px;right:6px;font-size:9px;font-weight:800;color:#fff;background:linear-gradient(120deg,#ffb340,#ff8fb1);border-radius:999px;padding:1px 6px;box-shadow:0 2px 6px rgba(255,150,90,.35)}
  .slot .curdot{position:absolute;top:5px;left:6px;font-size:9px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--purple),var(--pink));border-radius:999px;padding:1px 6px}

    /* 已移除：3D房间段（改为像素 LCD 渲染） */
/* ---------- 信息区 ---------- */
  .pet-name{margin:12px 2px 4px;font-size:20px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;letter-spacing:.2px}
  .pet-name small{font-size:12px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--purple),var(--pink));
    padding:4px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(139,123,255,.35)}
  .pet-name small.lim{background:linear-gradient(120deg,#ffb340,#ff8fb1);box-shadow:0 4px 12px rgba(255,150,90,.35)}
  .species-line{font-size:12px;color:var(--muted);margin:8px 2px 10px;line-height:1.68;
    background:var(--soft);border:1px solid var(--line2);border-radius:14px;padding:9px 12px}
  .species-line b{color:var(--purple)}
  .bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;flex:1;box-shadow:inset 0 1px 3px rgba(40,20,70,.08)}
  .bar.thin{height:8px}
  .bar i{display:block;height:100%;width:0%;border-radius:999px;background:var(--mint);
    transition:width .5s cubic-bezier(.2,.8,.3,1),background .45s ease;position:relative;overflow:hidden}
  .bar i::after{content:"";position:absolute;inset:0;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 58%)}
  .exp-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin:8px 2px 6px;font-variant-numeric:tabular-nums}
  #expFill{background:linear-gradient(90deg,var(--purple),var(--pink))}
  #affFill{background:linear-gradient(90deg,var(--amber),var(--pink))}
  .stats{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .stat{display:block}
  .stat-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .stat-top b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
  .status-line{margin-top:13px;display:flex;gap:6px;flex-wrap:wrap;min-height:22px}
  .tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--btn);color:var(--muted);
    box-shadow:var(--gloss)}
  .tag.warn{background:rgba(255,179,64,.18);color:#b26a00}
  .tag.bad{background:rgba(255,107,107,.16);color:#c0392b}
  .tag.good{background:rgba(79,201,168,.18);color:#1a7a5e}
  .tag.ba{background:rgba(90,140,255,.16);color:#3560c8}
  .tag.lim{background:linear-gradient(120deg,rgba(255,179,64,.24),rgba(255,143,177,.24));color:#b26a00}

  /* ---------- 按钮 ---------- */
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  @media (max-width:430px){ .actions{grid-template-columns:repeat(2,1fr)} }
  .btn{
    border:none;border-radius:16px;padding:12px 8px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--ink);
    background:var(--btn);transition:transform .15s cubic-bezier(.2,.8,.3,1),box-shadow .22s ease,opacity .18s;
    display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.25;box-shadow:var(--gloss);
  }
  .btn em{font-style:normal;font-size:20px;filter:drop-shadow(0 2px 3px rgba(60,30,90,.16))}
  .btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 24px rgba(96,84,180,.22), var(--gloss)}
  .btn:active:not(:disabled){transform:translateY(-1px) scale(.97)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.primary{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;box-shadow:0 8px 20px rgba(139,123,255,.35)}
  .btn.primary:hover:not(:disabled){box-shadow:0 14px 28px rgba(139,123,255,.45)}
  .btn.ba{background:linear-gradient(135deg,var(--ds),var(--purple));color:#fff;box-shadow:0 8px 20px rgba(77,107,254,.3)}
  .btn.small{padding:7px 13px;flex-direction:row;font-size:12.5px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow), var(--gloss)}
  .btn.small:hover:not(:disabled){border-color:var(--purple)}
  .btn.tiny{padding:7px 13px;flex-direction:row;font-size:12.5px;border-radius:11px;background:var(--btn)}

  /* ---------- tabs / 列表 ---------- */
  .tabs{display:flex;gap:4px;margin:15px 0 11px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:15px;flex-wrap:wrap}
  .tab{border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:800;color:var(--muted);
    padding:8px 12px;border-radius:11px;cursor:pointer;transition:.16s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--card);color:var(--purple);box-shadow:0 2px 10px rgba(96,84,180,.16)}
  .tab b{color:var(--pink)}
  .list{display:flex;flex-direction:column;gap:8px;max-height:346px;overflow:auto;padding-right:4px}
  .list::-webkit-scrollbar,.gacha-grid::-webkit-scrollbar,.species-list::-webkit-scrollbar,.game-list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb,.gacha-grid::-webkit-scrollbar-thumb,.species-list::-webkit-scrollbar-thumb,.game-list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:999px}
  .list::-webkit-scrollbar-track,.gacha-grid::-webkit-scrollbar-track,.species-list::-webkit-scrollbar-track,.game-list::-webkit-scrollbar-track{background:transparent}
  .group{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin:8px 2px 2px}
  .item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;background:var(--soft);
    border:1px solid var(--line2);transition:transform .16s ease,box-shadow .2s ease,border-color .2s}
  .item:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(96,84,180,.12);border-color:var(--purple)}
  .item.ba{background:var(--soft);border-color:var(--line2)}
  .item .ico{font-size:26px;flex:none;filter:drop-shadow(0 3px 5px rgba(60,30,90,.14))}
  .item .info{flex:1;min-width:0}
  .item .nm{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .item .ds{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .item .price{font-size:12.5px;font-weight:800;color:var(--amber);white-space:nowrap}
  .lock{font-size:10px;font-weight:800;color:#8a7bd8;background:var(--btn);border-radius:999px;padding:2px 7px}
  .lock.on{color:#b26a00;background:rgba(255,179,64,.18)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 0}
  .foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8}

  /* ---------- toast ---------- */
  .toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:linear-gradient(135deg,rgba(44,43,61,.96),rgba(70,58,110,.96));color:#fff;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;box-shadow:0 14px 30px rgba(0,0,0,.25);animation:toastIn .3s cubic-bezier(.2,.9,.3,1);max-width:88vw}
  .toast.out{opacity:0;transform:translateY(8px);transition:.4s}
  @keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

  /* ---------- 弹窗 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(28,22,52,.52);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    z-index:90;display:none;align-items:center;justify-content:center;padding:14px}
  .overlay.open{display:flex}
  .mini-card{background:var(--card);border-radius:24px;padding:16px;width:min(580px,96vw);
    box-shadow:0 30px 70px rgba(20,10,50,.42), var(--gloss);border:1px solid var(--line);
    animation:popIn .24s cubic-bezier(.2,.9,.3,1)}
  @keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .mini-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:12px;font-size:15.5px;gap:10px}
  .mini-head span{color:var(--purple);font-size:12.5px;font-weight:700;text-align:right}
  .mini-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:12px;gap:10px}
  .mini-result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
  .mini-result p{margin:0;font-size:14px;line-height:1.75}
  .result-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .badge-best{display:inline-block;font-size:11.5px;font-weight:800;color:#b26a00;background:rgba(255,179,64,.18);border-radius:999px;padding:4px 11px}
  .pnt{font-size:12px;color:var(--muted)}

  /* ---------- 弹窗与提示 ---------- */
  .game-list{display:grid;gap:10px;grid-template-columns:1fr 1fr;max-height:66vh;overflow:auto}
  @media (max-width:540px){ .game-list{grid-template-columns:1fr} }
  .game{display:flex;flex-direction:column;gap:7px;padding:13px;border-radius:18px;background:var(--soft);
    border:1.5px solid var(--line2);transition:transform .16s ease,box-shadow .2s}
  .game:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(96,84,180,.14)}
  .game .gh{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900}
  .game .gd{font-size:11.5px;color:var(--muted);line-height:1.6;min-height:36px}
  .game .gf{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .game .gb{font-size:11px;font-weight:800;color:#8a7bd8;background:var(--btn);border-radius:999px;padding:4px 9px}
    /* 靶心 */
  .tgt-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
  .target-track{position:relative;width:100%;height:56px;border-radius:999px;background:var(--soft);box-shadow:inset 0 2px 8px rgba(90,110,160,.18)}
  .target-zone{position:absolute;left:50%;top:0;transform:translateX(-50%);width:30%;height:100%;border-radius:999px;
    background:linear-gradient(90deg,rgba(255,143,177,0),rgba(255,180,64,.6),rgba(255,143,177,0))}
  .target-dot{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#fff,#ff8fb1 60%,#e0557f);box-shadow:0 0 14px rgba(255,143,177,.85)}
  .tgt-hint{font-size:12px;color:var(--muted);text-align:center}
  .tgt-btn{width:100%;max-width:260px;padding:16px;font-size:16px;flex-direction:row;justify-content:center}
  /* 连点 */
  .clk-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  .clk-count{font-size:44px;font-weight:900;color:var(--purple);font-variant-numeric:tabular-nums}
  .clk-btn{width:158px;height:158px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;font-size:20px;font-weight:900;color:#fff;
    background:radial-gradient(circle at 35% 30%,#ffb3d1,#8b7bff 70%);box-shadow:0 14px 30px rgba(110,95,200,.4), inset 0 2px 0 rgba(255,255,255,.35);user-select:none}
  .clk-btn:active{transform:scale(.94)}
  .clk-tip{font-size:12px;color:var(--muted);text-align:center}
    /* ---------- 抽卡 ---------- */
  .gacha-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .gacha-btns .btn{flex-direction:row;justify-content:center;padding:14px;font-size:14px}
  .gacha-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:54vh;overflow:auto;padding:2px}
  @media (max-width:540px){ .gacha-grid{grid-template-columns:repeat(3,1fr)} }
  .gcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px;border-radius:16px;background:var(--soft);
    border:1.5px solid var(--line2);animation:pop .22s cubic-bezier(.2,.9,.3,1);text-align:center}
  .gcard .ge{font-size:26px;line-height:1.1}
  .gcard .gn{font-size:10.5px;font-weight:700;line-height:1.3}
  .gcard.pet{background:linear-gradient(140deg,rgba(255,244,214,.9),rgba(255,224,239,.9));border-color:#ffc94d;
    box-shadow:0 8px 22px rgba(255,180,64,.35)}
  .gcard.deco{background:var(--soft);border-color:#b9d4ff}
  .gcard.wear{background:linear-gradient(140deg,rgba(255,236,246,.92),rgba(238,240,255,.92));border-color:#ffb3d1}
  .gcard .new{font-size:9px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--pink),var(--purple));border-radius:999px;padding:2px 7px}
  .gcard .dup{font-size:9px;font-weight:800;color:#8a7bd8;background:var(--btn);border-radius:999px;padding:2px 7px}
  .rate-line{font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line2);border-radius:14px;padding:9px 11px;line-height:1.75}
  .banner-list{display:grid;gap:8px;margin-bottom:8px}
  .banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:17px;background:var(--soft);
    border:1.5px solid var(--line2);cursor:pointer;transition:transform .16s ease,box-shadow .2s,border-color .2s}
  .banner:hover{transform:translateY(-2px);border-color:var(--purple)}
  .banner.cur{border-color:var(--purple);background:var(--btn);box-shadow:0 8px 20px rgba(96,84,180,.14)}
  .banner .bart{width:44px;flex:none;display:flex;justify-content:center;align-items:flex-end}
  .banner .bart svg{width:44px;height:auto}
  .banner .bart .emo{font-size:28px;line-height:1}
  .banner .binfo{flex:1;min-width:0}
  .banner .bnm{font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .banner .bds{font-size:11.5px;color:var(--muted);margin-top:3px}
  .banner .bcur{font-size:10px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--purple),var(--pink));border-radius:999px;padding:2px 9px}

  /* ---------- 存档 ---------- */
  .save-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
  .save-text{width:100%;height:132px;padding:11px;border-radius:14px;border:1.5px solid var(--line2);
    font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.55;resize:vertical;outline:none;
    color:var(--ink);background:var(--soft)}
  .save-text:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,123,255,.16)}
  .save-warn{font-size:11.5px;color:#c0392b;font-weight:700}

  /* ---------- 界面风格 ---------- */
  .theme-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media (max-width:480px){ .theme-list{grid-template-columns:repeat(2,1fr)} }
  .theme{display:flex;flex-direction:column;gap:6px;align-items:center;padding:11px 6px;border-radius:16px;
    background:var(--soft);border:1.5px solid var(--line2);cursor:pointer;transition:transform .16s ease,box-shadow .2s,border-color .2s}
  .theme:hover{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 10px 20px rgba(96,84,180,.14)}
  .theme.cur{border-color:var(--purple);background:var(--btn);box-shadow:0 0 0 2px var(--purple),0 10px 22px rgba(96,84,180,.18)}
  .theme .temo{font-size:18px;line-height:1}
  .theme .tn{font-size:12px;font-weight:800}

      PX.blinkT -= dt;
      PX.bob = Math.floor(PX.t * 2) % 2 === 1;
      if (PX.blinkT <= 0) { PX.blinkT = 2.2 + Math.random() * 2.4; PX.blink = 0.14; }
      if (PX.blink > 0) PX.blink -= dt;
      if (PX.hop > 0) PX.hop = Math.max(0, PX.hop - dt * 2.2);
      if (PX.pickT > 0) PX.pickT -= dt;
      if (PX.annoy > 0) PX.annoy -= dt;
      if (PX.landT > 0) PX.landT -= dt;

  // 出错不致命：记一次、救一把、最多提示一次
  function pxSoftError(e) {
    PX.err = String(e && e.message ? e.message : e);
    PX.errN = (PX.errN || 0) + 1;
    if (PX.errN === 3) { ensurePet(); toast('⚠️ 房间动画出了点小问题，已自动恢复'); }

  function pxStart() {

  // 布置面板里的家具缩略图（用同一套像素画函数，保证与房间一致）
  function paintFurnThumbs() {
    const list = el('list');
    if (!list || typeof list.querySelectorAll !== 'function') return;
    const cvs = list.querySelectorAll('canvas');
    for (let i = 0; i < cvs.length; i++) {
      const cv = cvs[i];
      if (!cv || !cv.dataset || !cv.dataset.furn) continue;
      const it = PLACE[cv.dataset.furn];
      if (!it || typeof cv.getContext !== 'function') continue;
      let c2 = null;
      try { c2 = cv.getContext('2d'); } catch (e) { c2 = null; }
      if (!c2) continue;
      cv.width = 34; cv.height = 30;
      if ('imageSmoothingEnabled' in c2) c2.imageSmoothingEnabled = false;
      const old = PX.ctx;
      PX.ctx = c2;
      c2.clearRect(0, 0, 34, 30);
      try { it.draw(17, 29, 0.6); } catch (e) {}
      PX.ctx = old;
    }
  }
  /* ---- 摆放交互：拖动位置 / 滚轮与滑块缩放 ---- */
  function pxItemsOwned() {
    const out = [];
    Object.keys(PLACE).forEach(k => {
      const it = PLACE[k];
      const own = it.kind === 'furn' ? !!(state.furnOwn && state.furnOwn[k]) : !!(state.decos && state.decos[it.key || k]);
      if (own) out.push(k);
    });
    return out;
  }
  function pxOwned(key) {
    const it = PLACE[key];
    if (!it) return false;
    return it.kind === 'furn'
      ? !!(state.furnOwn && state.furnOwn[key])
      : !!(state.decos && state.decos[it.key || key]);
  }
  // 家具可摆放范围：上到墙根，下到图标栏/道具栏之上（动态跟随窗口）
  function furnBounds() {
    return { x0: 0.06, x1: 0.94, y0: 0.30, y1: Math.max(0.36, (PXMENU_Y - 8) / PXH) };
  }
  function clampFurn(q) {
    const b = furnBounds();
    q.x = Math.max(b.x0, Math.min(b.x1, Number(q.x) || 0.5));
    q.y = Math.max(b.y0, Math.min(b.y1, Number(q.y) || b.y1));
    return q;
  }
  function pxAdd(key) {
    const it = PLACE[key];
    if (!it) return false;
    if (!pxOwned(key)) return false;             // 没有的东西不能摆
    const d = it.def || { x: 64, y: 96, s: 1 };
    if (!state.placed) state.placed = {};
    const q = clampFurn({ x: (d.x || 64) / 128, y: (d.y || 96) / 112, s: d.s || 1 });
    // 同一位置已经有东西就横着挪开一点，别叠在一起
    const near = Object.keys(state.placed).some(k2 => {
      const o = state.placed[k2];
      return o && Math.abs(o.x - q.x) < 0.09 && Math.abs(o.y - q.y) < 0.06;
    });
    if (near) { const b = furnBounds(); q.x = q.x + 0.12 > b.x1 ? b.x0 + 0.04 : q.x + 0.12; clampFurn(q); }
    state.placed[key] = q;
    state.sel = key;
    return true;
  }
  function pxDel(key) {
    key = key || state.sel;
    if (!key || !state.placed || !state.placed[key]) return false;
    delete state.placed[key];
    if (state.sel === key) state.sel = '';
    return true;
  }
  function pxScale(d) {
    const k = state.sel;
    if (!k || !state.placed || !state.placed[k]) return false;
    const cur = state.placed[k].s || 1;
    state.placed[k].s = Math.max(0.5, Math.min(2, Math.round((cur + d) * 100) / 100));
    return true;
  }
  function pxToLocal(ev) {
    const cv = PX.cv;
    let r = { left: 0, top: 0, width: PXW, height: PXH };
    if (cv && cv.getBoundingClientRect) { try { r = cv.getBoundingClientRect(); } catch (e) {} }
    const sx = (r.width || PXW) / PXW, sy = (r.height || PXH) / PXH;
    return { x: (ev.clientX - r.left) / (sx || 1), y: (ev.clientY - r.top) / (sy || 1) };
  }
  function pxHitTest(pt) {
    for (let i = PX.hit.length - 1; i >= 0; i--) {
      const o = PX.hit[i], s = o.px ? o.px.s : (o.pos.s || 1);
      const bxx = o.px ? o.px.x : 0, byy = o.px ? o.px.y : 0;
      const w = o.it.w * s, h = o.it.h * s;
      if (pt.x >= bxx - w / 2 - 2 && pt.x <= bxx + w / 2 + 2 &&
          pt.y >= byy - h - 2 && pt.y <= byy + 3) return o;
    }
    return null;
  }
  function wirePixel() {
    const cv = PX.cv;
    if (!cv || typeof cv.addEventListener !== 'function') return;
    cv.addEventListener('pointerdown', ev => {
      const pt = pxToLocal(ev);
      const icon = menuAt(pt);                       // 1) 触摸 LCD 图标栏
      if (icon) { menuFire(icon.key); PX.drag = null; PX.petDrag = null; PX.tap = false; if (ev.preventDefault) ev.preventDefault(); return; }
      if (state.edit) {                              // 2) 布置模式：拖动家具
        const hit = pxHitTest(pt);
        if (hit) { state.sel = hit.k; PX.drag = { k: hit.k, dx: pt.x - hit.px.x, dy: pt.y - hit.px.y }; }
        else { state.sel = ''; PX.drag = null; }
        render();
        if (ev.preventDefault) ev.preventDefault();
        return;
      }
      const p = P();                                 // 3) 拖动宠物 / 轻点抚摸
      if (pxHitPet(pt, p)) {
        PX.fall = null;
        const pp = petAt(p);
        PX.petDrag = { p: p, dx: pt.x - pp.cx, dy: pt.y - pp.by, moved: false };
        PX.annoy = 3;
        pxDraw();
      } else {
        PX.tap = true;
      }
      if (ev.preventDefault) ev.preventDefault();
    });
    cv.addEventListener('pointermove', ev => {
      if (PX.drag && state.placed && state.placed[PX.drag.k]) {          // 拖动家具：夹在可见范围内
        const q = state.placed[PX.drag.k];
        q.x = (pxToLocal(ev).x - PX.drag.dx) / PXW;
        q.y = (pxToLocal(ev).y - PX.drag.dy) / PXH;
        clampFurn(q);
      }
      const pt = pxToLocal(ev);
      if (PX.petDrag) {                              // 拖宠物：跟着鼠标走，并露出不耐烦表情
        const p = PX.petDrag.p;
        p.lx = Math.max(PET_X0, Math.min(PET_X1, (pt.x - PX.petDrag.dx) / PXW));
        p.ly = Math.max(PET_Y0, Math.min(PET_Y1, (pt.y - PX.petDrag.dy) / PXH));
        PX.petDrag.moved = true;
        PX.annoy = 3;
        pxDraw();
        if (ev.preventDefault) ev.preventDefault();
        return;
      }
      if (PX.drag && state.placed && state.placed[PX.drag.k]) {   // 拖家具
        const pos = state.placed[PX.drag.k];
        pos.x = Math.max(0.04, Math.min(0.96, (pt.x - PX.drag.dx) / PXW));
        pos.y = Math.max(0.06, Math.min((PXMENU_Y - 2) / PXH, (pt.y - PX.drag.dy) / PXH));
        pxDraw();
        if (ev.preventDefault) ev.preventDefault();
        return;
      }
      const icon2 = menuAt(pt);                      // 图标栏悬停高亮 + 提示
      const hk = icon2 ? icon2.key : '';
      if (hk !== PX.hover) {
        PX.hover = hk;
        const hint = el('roomHint');
        if (hint && !state.edit) hint.textContent = icon2 ? ('▸ ' + icon2.name + menuWhy(icon2.key)) : '拖动宠物陪它玩 · 点房间抚摸 · 点下方图标用功能';
        pxDraw();
      }
    });
    const up = () => {
      if (PX.petDrag) {
        PX.petDrag = null;
        const p = P();
        if ((Number(p.ly) || PET_GROUND) < PET_GROUND - 0.01) {
          PX.fall = { vy: 0.25 };                    // 松手时还在半空 → 掉下来，落地会叫一声
          PX.dir = 1;
        } else {
          // 已经在地面平面里：就留在松手的地方（含平面最低处），不再拉回远端
          p.ly = Math.max(PET_GROUND, Math.min(PET_WALK_HI, Number(p.ly) || PET_GROUND));
          p.lx = Math.max(PET_X0, Math.min(PET_X1, Number(p.lx) || 0.5));
          PX.annoy = 1.2;
          PX.walkWait = Math.max(PX.walkWait, 1.6);   // 先在你放下的地方待一会儿再自己走
          save();
        }
      } else if (PX.drag) {
        PX.drag = null;
        save();
      } else if (PX.tap) {
        PX.tap = false;
        petPet();                                    // 轻点房间 = 抚摸
      }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', ev => {
      if (!state.edit || !state.sel) return;
      if (ev.preventDefault) ev.preventDefault();
      pxScale(ev.deltaY < 0 ? 0.25 : -0.25);
      pxDraw();
      render();
      save();
    }, { passive: false });
  }
  // 宠物身体命中框（用来拖着它走）
  function pxHitPet(pt, p) {
    const q = petAt(p);
    return pt.x >= q.cx - 14 && pt.x <= q.cx + 14 && pt.y >= q.by - 34 && pt.y <= q.by + 4;
  }
  /* ================= 存档 ================= */
  function save() {
    try { state.lastTick = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  // 把任意（可能被手改过的）存档对象规范化成内部状态；读档与「导入存档」共用
  function normalizeSave(d) {
    const st = defaultState();
    st.pets = Array.isArray(d.pets) && d.pets.length
      ? d.pets.map(x => Object.assign(makePet(x && SPECIES[x.species] ? x.species : 'dragon'), x || {}))
      : [makePet('dragon')];
    st.pets = st.pets.slice(0, MAX_PETS);
    st.pets.forEach(p => {
      p.level = Math.max(1, Number(p.level) || 1);
      p.exp = Math.max(0, Number(p.exp) || 0);
      ['hunger','mood','clean','energy','health'].forEach(k => p[k] = clamp(Number(p[k]) || 0));
      p.affRank = Math.max(1, Number(p.affRank) || 1);
      p.affinity = Math.max(0, Number(p.affinity) || 0);
      p.asleep = !!p.asleep;
      p.ageTicks = Math.max(0, Number(p.ageTicks) || 0);
      const rawLx = Number(p.lx), rawLy = Number(p.ly);
      p.lx = Math.max(PET_X0, Math.min(PET_X1, rawLx > 1.5 ? rawLx / 128 : (rawLx || 0.5)));   // 老档按 128x112 换算
      p.ly = Math.max(PET_GROUND, Math.min(PET_Y1, rawLy > 1.5 ? rawLy / 112 : (rawLy || PET_GROUND)));
      const worn = (p.worn && typeof p.worn === 'object') ? p.worn : {};
      p.worn = {};
      WEAR_SLOTS.forEach(s => { if (worn[s] && WEAR[worn[s]] && WEAR[worn[s]].slot === s) p.worn[s] = worn[s]; });
      if (typeof p.name !== 'string' || !p.name) p.name = makePet(p.species).name;
      if (p.name.length > 8) p.name = p.name.slice(0, 8);
    });
    st.active = Math.min(Math.max(0, Number(d.active) || 0), st.pets.length - 1);
    ['coins','points','pointsTotal','pulls'].forEach(k => st[k] = Math.max(0, Number(d[k]) || 0));
    st.inv = Object.assign({}, d.inv || {});
    st.seenItems = Object.assign({}, d.seenItems || {});
    st.placed = {};
    if (d.placed && typeof d.placed === 'object') {
      Object.keys(d.placed).forEach(k => {
        if (!PLACE[k] || !d.placed[k]) return;
        const q = d.placed[k];
        st.placed[k] = {
          x: Math.max(0.04, Math.min(0.96, Number(q.x) > 1.5 ? Number(q.x) / 128 : (Number(q.x) || 0.5))),
          y: Math.max(0.06, Math.min(0.99, Number(q.y) > 1.5 ? Number(q.y) / 112 : (Number(q.y) || 0.85))),
          s: Math.max(0.5, Math.min(2, Number(q.s) || 1))
        };
      });
    }
    st.welcome = !!(d && d.welcome);
    st.picked = (d && d.picked === undefined) ? true : !!(d && d.picked);   // 老档直接算已选定
    st.furnOwn = {};
    Object.keys(PLACE).forEach(k => {
      if (PLACE[k].kind === 'furn' && d.furnOwn && d.furnOwn[k]) st.furnOwn[k] = 1;
    });
    // 老档迁移：已经抽到的装饰品自动摆进房间，避免房间突然变空
    Object.keys(DECO_PLACE).forEach(dk => {
      const pk = DECO_PLACE[dk];
      if (d.decos && d.decos[dk] && PLACE[pk] && !st.placed[pk]) {
        const df = PLACE[pk].def || { x: 64, y: 96, s: 1 };
        st.placed[pk] = { x: df.x, y: df.y, s: df.s || 1 };
      }
    });
    st.edit = false;
    st.sel = '';
    st.wear = {};
    Object.keys(WEAR).forEach(k => { if (d.wear && d.wear[k]) st.wear[k] = 1; });
    st.theme = THEMES[d.theme] ? d.theme : THEME_KEYS[0];
    st.accent = (typeof d.accent === 'string' && /^#[0-9a-fA-F]{6}$/.test(d.accent)) ? d.accent.toLowerCase() : '';
    st.camYaw = Math.max(-46, Math.min(46, Number(d.camYaw) || 0));
    st.camZoom = Math.max(0.78, Math.min(1.45, Number(d.camZoom) || 1));
    st.decos = Object.assign({}, d.decos || {});
    st.collection = Array.isArray(d.collection) ? d.collection.filter(k => SPECIES[k] && SPECIES[k].limited) : [];
    st.pity = Math.max(0, Math.min(199, Number(d.pity) || 0));
    st.banner = BANNERS.some(b => b.key === d.banner) ? d.banner : 'whale';
    st.hasToy = !!d.hasToy;
    st.best = Object.assign({ disc:0, memory:0, target:0, clicker:0 }, d.best || {});
    st.title = typeof d.title === 'string' ? d.title : '';
    st.decor = !!d.decor; st.memoUnlocked = !!d.memoUnlocked; st.gearGiven = !!d.gearGiven;
    st.lastTick = Number(d.lastTick) || Date.now();
    st.workReady = Number(d.workReady) || 0;
    return st;
  }

  function load() {
    try {
      let raw = localStorage.getItem(SAVE_KEY);
      if (!raw) {
        // 从旧版（单宠物扁平结构）迁移
        const old = localStorage.getItem(OLD_KEY);
        if (!old) return false;
        const o = JSON.parse(old);
        const key = SPECIES[o.species] ? o.species : 'dragon';
        const st = defaultState();
        const p = makePet(key);
        p.name = o.name || p.name; p.level = o.level || 1; p.exp = o.exp || 0;
        ['hunger','mood','clean','energy','health'].forEach(k => p[k] = clamp(Number(o[k]) || p[k]));
        p.affRank = Math.max(1, Number(o.affRank) || 1);
        p.affinity = Math.max(0, Number(o.affinity) || 0);
        p.asleep = !!o.asleep; p.ageTicks = Number(o.ageTicks) || 0;
        st.pets = [p]; st.coins = Math.max(0, Number(o.coins) || 0);
        st.inv = Object.assign({}, o.inv || {});
        st.hasToy = !!o.hasToy;
        st.best = Object.assign(st.best, o.best || {});
        st.points = Math.max(0, Number(o.points) || 0);
        st.pointsTotal = Math.max(0, Number(o.pointsTotal) || 0);
        st.title = typeof o.title === 'string' ? o.title : '';
        st.decor = !!o.decor; st.memoUnlocked = !!o.memoUnlocked;
        st.lastTick = Number(o.lastTick) || Date.now();
        state = st;
        return true;
      }
      const d = JSON.parse(raw);
      state = normalizeSave(d);
      return true;
    } catch (e) { return false; }
  }

  /* ================= 页内对话框（替代原生 confirm / prompt，避免被 iframe 沙箱拦截） ================= */

  // 喂食动画：食物从右侧竖栏飞向宠物 → 咀嚼 → 冒数字
  function feedFx(emoji, text) {

  function gainFx(text) {

  function fx(emoji) {

  /* ================= 数值 ================= */
  function applyEffects(effects, moodMul, hungerMul) {
    const p = P();
    Object.keys(effects).forEach(k => {
      if (!(k in p)) return;
      let v = effects[k];
      if (k === 'mood' && moodMul) v = v * moodMul;
      if (k === 'hunger' && hungerMul) v = v * hungerMul;
      p[k] = clamp(p[k] + v);
    });
  }

  function addExp(n) {
    if (!n) return;
    const p = P();
    const gain = Math.max(1, Math.round(n * (spOf(p).perks.expMul || 1)));   // 白龙娘学得快
    const oldStage = stageOf(p).name;
    p.exp += gain;
    let leveled = false;
    while (p.exp >= expNeed(p.level)) {
      p.exp -= expNeed(p.level);
      p.level++;
      state.coins += 50;                                     // 每升一级给 50 信用点
      p.mood = clamp(p.mood + 10);
      leveled = true;
    }
    if (leveled) {
      const st = stageOf(p);
      if (st.name !== oldStage) toast('✨ 成长啦！' + p.name + ' 现在是「' + st.name + '」');
      else toast('🎉 升级！' + p.name + ' 到 Lv.' + p.level + '（信用点 +50 · 栏位 ' + slotsUnlocked() + '/' + MAX_PETS + '）');
    }
  }

  function addAffinity(n) {
    if (!n) return;
    const p = P();
    p.affinity += n;
    let ranked = false;
    while (p.affinity >= affNeed(p.affRank)) {
      p.affinity -= affNeed(p.affRank);
      p.affRank++;
      const bonus = 10 * p.affRank;
      state.coins += bonus;
      ranked = true;
      toast('💗 ' + p.name + ' 羁绊提升！Lv.' + p.affRank + '（信用点 +' + bonus + '）');
      if (p.affRank === 9 && !state.memoUnlocked) { state.memoUnlocked = true; toast('🌌 羁绊 Lv.9：解锁「记忆大厅」'); }
      if (p.affRank === 15 && !state.gearGiven) {
        state.gearGiven = true;
        state.inv.pillow = (state.inv.pillow | 0) + 1;
        toast('🎁 羁绊 Lv.15：获得专属装备「随地入梦枕」');
      }
    }
    if (ranked) p.mood = clamp(p.mood + 5);
  }

  /* ================= 游戏刻 ================= */
  // p 既可以是宠物对象，也可以是任意同构对象；mode: active | bench
  function stepPet(p, mode) {
    const sp = spOf(p), d = sp.decay, pk = sp.perks;
    const k = mode === 'active' ? 1 : 0.5;
    let woke = false;
    if (p.asleep) {
      p.energy += 6 * (pk.sleepEnergy || 1) * (mode === 'active' ? 1 : 0.5);
      if (pk.sleepMood) p.mood += pk.sleepMood;
      p.hunger -= 0.15 * k; p.mood -= 0.08 * k; p.clean -= 0.10 * k;
      p.health += p.hunger > 25 ? 1.4 * k : -1.0 * k;
      if (p.energy >= 100) { p.energy = 100; p.asleep = false; woke = true; }
    } else {
      p.hunger -= 0.30 * d.hunger * k;
      p.mood   -= 0.28 * d.mood * k;
      p.clean  -= 0.24 * d.clean * k;
      if (mode === 'active') p.energy -= 0.32 * d.energy;
      else p.energy += 0.15;                                   // 在家休息，慢慢回精力
      if (p.hunger < 20) p.health -= 1.0 * k;
      if (p.clean  < 20) p.health -= 0.7 * k;
      if (p.mood   < 20) p.health -= 0.5 * k;
      if (p.hunger >= 40 && p.clean >= 40 && p.mood >= 40) p.health += 0.8;
    }
    ['hunger','mood','clean','energy','health'].forEach(x => p[x] = clamp(p[x]));
    p.ageTicks = (p.ageTicks || 0) + 1;
    return woke;
  }

  function tick() {
    try {                                                    // 一次出错不该让整个游戏停摆
      const p = P();
      if (stepPet(p, 'active')) toast('☀️ ' + p.name + ' 睡饱啦，精神满满！');
      addExp(2);
      addAffinity(p.asleep ? 0.4 : 0.3);
      state.pets.forEach((q, i) => { if (i !== state.active) stepPet(q, 'bench'); });
      render();
      save();
    } catch (e) { pxSoftError(e); PX.tickErr = String(e && e.message ? e.message : e); }
  }

  function offlinePet(p, ticks, mode) {
    const k = mode === 'active' ? 1 : 0.5;
    const pk = spOf(p).perks;
    p.hunger -= Math.min(ticks * 0.30, 45) * k;
    p.mood   -= Math.min(ticks * 0.28, 40) * k;
    p.clean  -= Math.min(ticks * 0.24, 38) * k;
    if (p.asleep) {
      p.energy += Math.min(ticks * 6 * (pk.sleepEnergy || 1), 100) * k;
      if (p.energy >= 100) { p.energy = 100; p.asleep = false; }
    } else if (mode === 'active') {
      p.energy -= Math.min(ticks * 0.32, 25);
    } else {
      p.energy += Math.min(ticks * 0.15, 40);
    }
    ['hunger','mood','clean','energy','health'].forEach(x => p[x] = clamp(p[x]));
    p.ageTicks = (p.ageTicks || 0) + Math.min(ticks, 2000);
  }

  function applyOffline() {
    const ticks = Math.floor((Date.now() - state.lastTick) / TICK_MS);
    if (ticks < 1) return null;
    state.pets.forEach((p, i) => offlinePet(p, ticks, i === state.active ? 'active' : 'bench'));
    return '你离开了 ' + fmtDur(ticks * TICK_MS) + '，' + P().name + ' 有点想你了～';
  }
  function fmtDur(ms) {
    const m = Math.floor(ms / 60000);
    if (m < 60) return m + ' 分钟';
    const h = Math.floor(m / 60);
    return h + ' 小时' + (m % 60 ? (m % 60) + ' 分' : '');
  }

  /* ================= 行为 ================= */
  function isFav(key, p) {
    const fav = spOf(p).perks.favItems || [];
    return fav.indexOf(key) >= 0;
  }

  /* ---- 最底部道具使用栏：只在功能界面打开时出现，一排道具 + 左右箭头翻页 ---- */
  let usePage = 0;
  const OVERLAY_IDS = ['adoptOverlay', 'gachaOverlay', 'hubOverlay', 'miniOverlay', 'saveOverlay', 'themeOverlay', 'dlgOverlay'];
  function anyUiOpen() {                                   // 是否打开了某个功能界面（页面或弹窗）
    if (uiTab) return true;
    for (let i = 0; i < OVERLAY_IDS.length; i++) {
      const e = el(OVERLAY_IDS[i]);
      if (e && e.classList && e.classList.contains && e.classList.contains('open')) return true;
    }
    return false;
  }
  function useKeys() {                                     // 当前可用（可对这只宠物使用）的道具
    const p = P(), sp = spOf(p);
    return Object.keys(state.inv).filter(k => (state.inv[k] | 0) > 0 && SHOP[k] &&
      !(SHOP[k].only && SHOP[k].only !== p.species) && !(SHOP[k].onlyKind === 'ai' && !sp.ai));
  }
  function usePageSize() {
    const vw = Math.max(320, (typeof window !== 'undefined' && window.innerWidth) || 1024);
    return Math.max(3, Math.floor((vw - 92) / 92));        // 一排能放几个（压扁的一排，留余量不裁切）
  }
  function useShift(d) {
    const keys = barSet().keys, size = usePageSize();      // 按当前功能键对应的那类道具翻页
    const pages = Math.max(1, Math.ceil(keys.length / size));
    usePage = Math.max(0, Math.min(pages - 1, usePage + d));
    render();
  }
  // 底部通用道具栏：点哪个功能键，就出哪种类型的道具
  function barSet() {
    const p = P(), sp = spOf(p);
    if (uiTab === 'wear')   return { kind:'wear',   label:'🎀 佩饰', act:'wear',   keys: Object.keys(WEAR).filter(k => state.wear[k]) };
    if (uiTab === 'room')   {
      const owned = Object.keys(PLACE).filter(k => {
        const it = PLACE[k];
        return it.kind === 'furn' ? !!(state.furnOwn && state.furnOwn[k]) : !!(state.decos && state.decos[it.key || k]);
      });
      return { kind:'room', label:'🛋️ 家具', act:'sel', keys: owned };
    }
    return { kind:'bag', label:'🎒 道具', act:'use', keys: useKeys() };
  }
  let useKind = '';
  function barChip(kind, k) {
    const p = P(), sp = spOf(p);
    if (kind === 'shop') {
      const it = SHOP[k];
      const owned = it.wear ? !!state.wear[k] : (it.furn ? !!(state.furnOwn && state.furnOwn[it.furnKey]) : (it.once && state.hasToy));
      const locked = (it.only && it.only !== p.species) || (it.onlyKind === 'ai' && !sp.ai);
      const poor = state.coins < it.price;
      return '<button class="ub-chip' + (owned ? ' done' : '') + '" data-action="buy:' + k + '" title="' + it.name + '：' + it.desc + '"' +
        (owned || locked || poor ? ' disabled' : '') + '><em>' + it.emoji + '</em>' + it.name.slice(0, 4) +
        '<span class="cnt">' + (owned ? '已有' : '💰' + it.price) + '</span></button>';
    }
    if (kind === 'wear') {
      const it = WEAR[k], on = (p.worn || {})[k] || Object.keys(p.worn || {}).some(s2 => p.worn[s2] === k);
      return '<button class="ub-chip' + (on ? ' on' : '') + '" data-action="wear:' + k + '" title="' + it.name + '：' + WEAR_SLOT_NAME[it.slot] + '（点一下戴上/脱下）">' +
        '<em>' + it.emoji + '</em>' + it.name.slice(0, 4) + '<span class="cnt">' + (on ? '戴着' : '空') + '</span></button>';
    }
    if (kind === 'room') {
      const it = PLACE[k], placed = !!(state.placed && state.placed[k]), sel = state.sel === k;
      return '<button class="ub-chip' + (placed ? ' on' : '') + (sel ? ' sel' : '') + '" data-action="sel:' + k + '" title="' + it.name + '：' +
        (placed ? '已摆放（点一下选中，可拖动/滚轮缩放）' : '点一下摆到房间') + '"><em>' + it.emoji + '</em>' + it.name.slice(0, 4) +
        '<span class="cnt">' + (placed ? Math.round((state.placed[k].s || 1) * 100) + '%' : '未摆') + '</span></button>';
    }
    if (kind === 'gacha') {
      const b = BANNERS.filter(x => x.key === k)[0] || {};
      const cur = b.key === state.banner;
      const owned = state.collection.indexOf(b.pet) >= 0;
      return '<button class="ub-chip' + (cur ? ' on' : '') + '" data-action="banner:' + k + '" title="' + b.name + '：' + b.desc + '">' +
        '<em>' + b.emoji + '</em>' + (b.pet ? SPECIES[b.pet].name.slice(0, 4) : b.key) +
        '<span class="cnt">' + (cur ? '当前' : owned ? '已有' : '选它') + '</span></button>';
    }
    if (kind === 'points') {
      const it = POINT_SHOP[k], owned = it.flag && state[it.flag];
      return '<button class="ub-chip' + (owned ? ' done' : '') + '" data-action="redeem:' + k + '" title="' + it.name + '：' + it.desc + '"' +
        (owned || state.points < it.cost ? ' disabled' : '') + '><em>' + it.emoji + '</em>' + it.name.slice(0, 4) +
        '<span class="cnt">⭐' + it.cost + '</span></button>';
    }
    const it = SHOP[k], locked = (it.only && it.only !== p.species) || (it.onlyKind === 'ai' && !sp.ai);
    return '<button class="ub-chip" data-action="use:' + k + '" title="' + it.name + '：' + it.desc + '"' +
      (p.asleep || locked ? ' disabled' : '') + '><em>' + it.emoji + '</em>' + it.name.slice(0, 4) +
      '<span class="cnt">x' + (state.inv[k] | 0) + '</span></button>';
  }
  function barExtras(kind) {                       // 各类道具自己的快捷键
    const p = P();
    let h = '';
    if (kind === 'bag') {
      const hasFood = useKeys().some(k => SHOP[k].effects && SHOP[k].effects.hunger);
      if (hasFood) h += '<button class="ub-chip feed" data-action="feedbest"' + (p.asleep ? ' disabled' : '') + ' title="自动挑最好的一份喂给它">🍚 一键</button>';
    } else if (kind === 'room') {
      h += '<button class="ub-chip tool' + (state.edit ? ' on' : '') + '" data-action="edit" title="进入/退出布置模式">🛠️ ' + (state.edit ? '完成' : '布置') + '</button>';
      if (state.sel && state.placed[state.sel]) {
        h += '<button class="ub-chip tool" data-action="scl:-0.25" title="缩小">－</button>';
        h += '<button class="ub-chip tool" data-action="scl:0.25" title="放大">＋</button>';
        h += '<button class="ub-chip tool" data-action="furnback:' + state.sel + '" title="收回这件家具">收回</button>';
      }
    } else if (kind === 'gacha') {
      h += '<button class="ub-chip tool" data-action="pull:1" title="单抽 ' + PULL_1 + ' 点信用点">单抽💰' + PULL_1 + '</button>';
      h += '<button class="ub-chip tool" data-action="pull:10" title="十连 ' + PULL_10 + ' 点信用点">十连💰' + PULL_10 + '</button>';
    }
    return h;
  }
  function paintUseBar() {
    const bar = el('useBar'), track = el('useTrack');
    if (!bar || !track) return;
    const open = anyUiOpen();
    if (bar.classList && bar.classList.toggle) bar.classList.toggle('open', open);
    if (!open) { track.innerHTML = ''; return; }            // 不打开功能界面时不出现
    const set = barSet();
    if (set.kind !== useKind) { useKind = set.kind; usePage = 0; }     // 换功能键 → 从第一页开始
    const keys = set.keys, size = usePageSize();
    const pages = Math.max(1, Math.ceil(keys.length / size));
    usePage = Math.max(0, Math.min(pages - 1, usePage));
    const slice = keys.slice(usePage * size, usePage * size + size);
    let h = barExtras(set.kind);
    if (!keys.length) {
      h += '<span class="ub-empty">' + (set.kind === 'bag' ? '🎒 背包里没有可用的道具'
        : set.kind === 'wear' ? '🎀 还没有佩饰～去商店买或抽卡'
        : set.kind === 'room' ? '🛋️ 还没有家具～去商店「家具」买'
        : set.kind === 'points' ? '🏆 暂无可兑换的' : '这里还没有东西') + '</span>';
    } else slice.forEach(k => { h += barChip(set.kind, k); });
    if (pages > 1) h = '<span class="ub-title">' + set.label + ' ' + (usePage + 1) + '/' + pages + '</span>' + h;
    track.innerHTML = h;
    const a1 = el('usePrev'), a2 = el('useNext');           // 箭头只在这条栏里，栏不打开时看不到
    if (a1) a1.disabled = usePage <= 0;
    if (a2) a2.disabled = usePage >= pages - 1;
  }

  // 一键喂食：自动挑「最管饱 / 最爱吃」的那一份（喂食栏收进背包后的一键入口）
  function feedBest() {
    const p = P();
    if (!p) return;
    if (p.asleep) { toast('😴 它睡着了，先叫醒它再喂'); return; }
    const cand = Object.keys(state.inv).filter(k => (state.inv[k] | 0) > 0 && SHOP[k] &&
      !SHOP[k].wear && !SHOP[k].furn && !SHOP[k].deco && SHOP[k].effects && SHOP[k].effects.hunger &&
      !(SHOP[k].only && SHOP[k].only !== p.species) && !(SHOP[k].onlyKind === 'ai' && !spOf(p).ai));
    if (!cand.length) { toast('🎒 背包里没有食物了'); openPage('bag'); return; }
    cand.sort((a, b) => {
      const fa = isFav(a, p) ? 1 : 0, fb = isFav(b, p) ? 1 : 0;
      if (fa !== fb) return fb - fa;                                    // 先挑它爱吃的
      const cheap = p.hunger > 70 ? 100 : 0;                            // 不太饿时别浪费大餐
      return (SHOP[b].effects.hunger - cheap) - (SHOP[a].effects.hunger - cheap);
    });
    useItem(cand[0]);
  }

  function useItem(key) {
    const item = SHOP[key];
    const p = P();
    if (!item) return;
    if (item.only && item.only !== p.species) {
      toast('这是' + SPECIES[item.only].name + '专属道具');
      return;
    }
    if (item.onlyKind === 'ai' && !spOf(p).ai) {
      toast('这是 AI 型宠物专用道具（' + AI_NAMES + '）');
      return;
    }
    if (p.asleep) { toast('😴 ' + p.name + ' 睡着了，先叫醒它'); return; }
    if ((state.inv[key] | 0) <= 0) { toast('背包里没有' + item.name + '了'); return; }

    const fav = isFav(key, p);
    const moodMul = fav ? (spOf(p).perks.sweetMood || 1.4) : 1;
    const hungerMul = item.effects.hunger ? (spOf(p).perks.foodMul || 1) : 1;
    state.inv[key]--;
    state.seenItems[key] = 1;
    applyEffects(item.effects, moodMul, hungerMul);
    if (item.once) state.hasToy = true;
    addExp(item.exp);
    addAffinity(fav ? (item.favAff || 4) : 2);
    // 喂食动画：算好本次增量 → 食物飞过去 + 宠物咀嚼 + 数值上浮
    const gain = [];
    if (item.effects.hunger) gain.push('🍖+' + Math.round(item.effects.hunger * hungerMul));
    if (item.effects.mood) gain.push('😊+' + Math.round(item.effects.mood * moodMul));
    if (item.effects.energy) gain.push('⚡+' + item.effects.energy);
    if (item.effects.clean) gain.push('🫧+' + item.effects.clean);
    if (item.effects.health) gain.push('❤️+' + item.effects.health);
    if (item.effects.hunger) feedFx(item.emoji, gain.join(' '));
    else { fx(item.emoji); if (gain.length) gainFx(gain.join(' ')); }
    toast(item.emoji + ' ' + p.name + ' 使用了 ' + item.name + (fav ? '（它很喜欢！心情额外提升）' : ''));
    render(); save();
  }

  function buy(key) {
    const item = SHOP[key], p = P();
    if (!item) return;
    if (item.only && item.only !== p.species) { toast('这是' + SPECIES[item.only].name + '专属道具，换个宠物才能买'); return; }
    if (item.onlyKind === 'ai' && !spOf(p).ai) { toast('这是 AI 型宠物专用道具（' + AI_NAMES + '），换个 AI 型宠物才能买'); return; }
    if (item.furn) {
      const fk = item.furnKey;
      if (state.furnOwn[fk]) { toast('已经拥有' + item.name + '啦'); return; }
      if (state.coins < item.price) { toast('💰 信用点不够，去打打工或玩游戏赚点吧'); return; }
      state.coins -= item.price;
      state.furnOwn[fk] = 1;
      state.seenItems[key] = 1;
      if (!state.placed) state.placed = {};
      if (!state.placed[fk]) { const df = PLACE[fk].def || { x: 64, y: 96, s: 1 }; state.placed[fk] = { x: df.x, y: df.y, s: df.s || 1 }; }
      state.edit = true; state.sel = fk;
      toast('🛋️ 买到了 ' + item.name + '，已放进房间，拖动摆好位置吧');
      render(); save(); return;
    }
    if (item.wear) {
      if (state.wear[key]) { toast('已经拥有' + item.name + '啦'); return; }
      if (state.coins < item.price) { toast('💰 信用点不够，去打打工或玩游戏赚点吧'); return; }
      state.coins -= item.price;
      state.wear[key] = 1;
      state.seenItems[key] = 1;
      toast('🎀 买到了 ' + item.name + '，去「🎀 佩饰」给它戴上');
      render(); save(); return;
    }
    if (item.once && state.hasToy) { toast('已经拥有' + item.name + '啦'); return; }
    if (state.coins < item.price) { toast('💰 信用点不够，去打工或玩小游戏赚点吧'); return; }
    state.coins -= item.price;
    state.inv[key] = (state.inv[key] | 0) + 1;
    state.seenItems[key] = 1;
    toast('🛒 买到了 ' + item.name);
    render(); save();
  }

  function play() {
    const p = P(), pk = spOf(p).perks;
    if (p.asleep) { toast('😴 ' + p.name + ' 在睡觉呢'); return; }
    if (p.energy < 10) { toast('⚡ 精力不够，先让它休息一下吧'); return; }
    const moodGain = Math.round((state.hasToy ? 26 : 18) * (pk.playMood || 1));
    const expGain  = Math.round((state.hasToy ? 20 : 12) * (pk.playExp || 1));
    p.energy = clamp(p.energy - 10);
    p.hunger = clamp(p.hunger - 5);
    applyEffects({ mood: moodGain });
    addExp(expGain);
    addAffinity(4);
    let msg = '🎾 ' + p.name + ' 玩得好开心！';
    if (Math.random() < 0.25) { state.coins += 6; msg = '🎾 玩得开心，还捡到 💰6！'; }
    fx('💖');
    toast(msg);
    render(); save();
  }

  function bath() {
    const p = P(), pk = spOf(p).perks;
    if (p.asleep) { toast('😴 睡着了不能洗澡哦'); return; }
    if (p.clean >= 98) { toast('🫧 已经很干净啦'); return; }
    p.clean = clamp(p.clean + 48 * (pk.bathGain || 1));
    p.mood  = clamp(p.mood - 4);
    addExp(8);
    addAffinity(2);
    fx('🫧');
    toast('🛁 ' + p.name + ' 洗得香喷喷，清洁度大涨！');
    render(); save();
  }

  /* ---------- 抚摸（按钮或直接点宠物） ---------- */
  const PET_LINES = {
    dragon : ['团子眯起眼睛，把脑袋往你手心里顶', '团子的尾巴轻轻拍了两下地板'],
    hoshino: ['星野「嗯……」了一声，像大叔一样把头枕在你的手上', '星野半睁着眼蹭了蹭，好像打算就这么睡过去'],
    cat    : ['咪咪发出咕噜咕噜的声音', '咪咪翻过身来露出肚皮——这是最高信任'],
    whale  : ['大肥鱼整只软软地瘫在你手上，体重感人', '大肥鱼开心地用尾鳍拍了拍地面'],
    gpt    : ['GPT 安静地把头低下来，龙角轻轻碰到你的手', 'GPT 的银白翅膀抖了一下，发出细微的嗡鸣']
  };
  function petPet() {
    const p = P(), sp = spOf(p);
    const lines = PET_LINES[sp.key] || PET_LINES.dragon;
    const line = lines[Math.floor(Math.random() * lines.length)];
    if (p.asleep) {
      addAffinity(1);
      toast('💤 ' + line + '（睡梦中，羁绊 +1）');
      render(); save();
      return;
    }
    const gain = p.mood < 60 ? 8 : 4;      // 心情好时小幅提升，避免无脑刷
    p.mood = clamp(p.mood + gain);
    addExp(1);
    addAffinity(2);
    fx('💗');
    PX.hop = 0.8;
    pxAddHearts(4, petAt(p).cx);
    let msg = '🤚 ' + line + '（心情 +' + gain + '）';
    if (Math.random() < 0.06) { state.coins += 3; msg += '，还在毛里发现 💰3'; }
    toast(msg);
    render(); save();
  }

  function toggleSleep() {
    const p = P();
    if (p.asleep) { p.asleep = false; toast('☀️ ' + p.name + ' 醒来了'); }
    else { p.asleep = true; toast('💤 ' + p.name + ' 开始睡觉，精力恢复中…'); }
    render(); save();
  }

  function work() {
    const p = P();
    if (p.asleep) { toast('😴 ' + p.name + ' 在睡觉'); return; }
    const left = state.workReady - Date.now();
    if (left > 0) { toast('💼 休息一下，' + Math.ceil(left / 1000) + ' 秒后再打工'); return; }
    if (p.energy < 20) { toast('⚡ 精力不足，没法打工'); return; }
    const pay = rand(12, 26);
    state.coins += pay;
    p.energy = clamp(p.energy - 20);
    p.mood   = clamp(p.mood - 8);
    state.workReady = Date.now() + WORK_CD;
    addExp(15);
    addAffinity(2);
    fx('💰');
    toast('💼 打工结束，赚到 💰' + pay);
    render(); save();
  }

  /* ================= 宠物槽：领养 / 切换 ================= */
  function switchPet(i) {
    if (i < 0 || i >= state.pets.length || i === state.active) return;
    state.active = i;
    toast('🔁 换成 ' + P().name + ' 出战');
    render(); save();
  }

  function adopt(key) {
    const sp = SPECIES[key];
    if (!sp) return;
    if (sp.limited && state.collection.indexOf(key) < 0) {
      toast('🔒 「' + sp.name + '」是抽卡限定宠物，去「🎰 抽卡」试试手气');
      return;
    }
    if (!state.picked) {                                     // 首次进游戏：只能选一只（替换掉初始宠物）
      state.picked = true;
      doAdopt(key, 0);
      toast('🎉 初始宠物选定！升级会解锁更多栏位（每级 +1 栏位、+50 信用点）');
      return;
    }
    const unlocked = slotsUnlocked();
    if (state.pets.length >= unlocked) {
      if (unlocked >= MAX_PETS) { toast('🐾 已经有 ' + MAX_PETS + ' 只宠物了，养不过来啦'); return; }
      toast('🔒 宠物栏位满了（' + state.pets.length + '/' + unlocked + '）· 升到 Lv.' + (unlocked + 1) + ' 解锁新栏位');
      return;
    }
    doAdopt(key, -1);
  }

  function doAdopt(key, slot) {
    const np = makePet(key);
    // 同名自动加序号，避免出现两只「咪咪」
    const base = np.name;
    let n = 2;
    while (state.pets.some((q, i) => i !== slot && q.name === np.name)) { np.name = base + n; n++; }
    if (slot >= 0 && slot < state.pets.length) state.pets[slot] = np;
    else state.pets.push(np);
    state.active = slot >= 0 ? slot : state.pets.length - 1;
    toast('🐾 ' + np.name + '（' + SPECIES[key].name + '）加入了！');
    closeAdopt(); render(); save();
  }

  function openAdopt(force) {
    const o = el('adoptOverlay');
    // 从「＋」空位 / 「领养新宠物」按钮进来时永远只打开；只有顶部 🐾 图标才是"再点收起"
    if (!force && o && o.classList && o.classList.contains && o.classList.contains('open')) { closeAdopt(); return; }
    uiTab = '';                                               // 收起上一页（旧白框）
    closeOtherPanels('adoptOverlay');
    o.classList.add('open'); render();
  }
  function closeAdopt() { el('adoptOverlay').classList.remove('open'); paintUseBar(); }

  /* ================= 抽卡 ================= */
  function pull(n) {
    const times = n >= 10 ? 10 : 1;
    const cost = times === 10 ? PULL_10 : PULL_1;
    if (state.coins < cost) {
      toast('💰 信用点不够（需要 ' + cost + '），去打工或玩小游戏赚吧');
      return;
    }
    state.coins -= cost;
    const results = [];
    for (let i = 0; i < times; i++) {
      state.pulls++;
      state.pity = (state.pity | 0) + 1;
      const bn = BANNERS.filter(b => b.key === state.banner)[0] || BANNERS[0];
      let petKey = '', pityKind = '';
      if (state.pity >= PITY_BIG) {                 // 100 抽大保底：必定出当期限定，不歪
        petKey = bn.pet; pityKind = 'big';
      } else if (state.pity >= PITY_SMALL) {        // 50 抽小保底：必出限定，60% 歪到星野
        petKey = Math.random() < SPOOK_AT_PITY ? (bn.spook || 'hoshino') : bn.pet;
        pityKind = petKey === bn.pet ? 'small' : 'spook';
      } else if (Math.random() < PET_RATE) {        // 常规 1.5%，也有概率歪
        petKey = Math.random() < SPOOK_RATE ? (bn.spook || 'hoshino') : bn.pet;
      }
      if (petKey) {
        state.pity = 0;                             // 出限定即重置保底
        const isNew = state.collection.indexOf(petKey) < 0;
        if (isNew) state.collection.push(petKey);
        else { state.points += DUP_PET_PTS; state.pointsTotal += DUP_PET_PTS; }
        results.push({ type:'pet', key: petKey, dup: !isNew, pity: pityKind, spook: petKey !== bn.pet });
      } else {
        const pick = pickGachaItem();
        if (pick.kind === 'wear') {
          const isNew = !state.wear[pick.key];
          if (isNew) state.wear[pick.key] = 1;
          else { state.points += DUP_WEAR_PTS; state.pointsTotal += DUP_WEAR_PTS; }
          results.push({ type:'wear', key: pick.key, dup: !isNew });
        } else if (pick.kind === 'deco') {
          const isNew = !state.decos[pick.key];
          state.decos[pick.key] = (state.decos[pick.key] | 0) + 1;
          if (!isNew) { state.points += DUP_DECO_PTS; state.pointsTotal += DUP_DECO_PTS; }
          results.push({ type:'deco', key: pick.key, dup: !isNew });
        } else {
          state.inv[pick.key] = (state.inv[pick.key] | 0) + 1;
          results.push({ type:'food', key: pick.key, amount:1 });
        }
      }
    }
    showGacha(results);
    save(); render();
  }

  function pickGachaItem() {
    const total = GACHA.reduce((n, g) => n + g.w, 0);
    let r = Math.random() * total;
    for (let i = 0; i < GACHA.length; i++) { r -= GACHA[i].w; if (r < 0) return GACHA[i]; }
    return GACHA[GACHA.length - 1];
  }

  function showGacha(results) {
    const gridHtml = results.map(r => {

        const marks = (r.spook ? '<span class="dup">歪！</span>' : '') +

        tag = marks + (r.dup ? '<span class="dup">重复 +' + DUP_PET_PTS + '⭐</span>' : '<span class="new">NEW 限定</span>');
      } else if (r.type === 'wear') {
        cls += ' wear'; emoji = WEAR[r.key].emoji; name = WEAR[r.key].name;
        tag = r.dup ? '<span class="dup">重复 +' + DUP_WEAR_PTS + '⭐</span>' : '<span class="new">NEW 佩饰</span>';
      } else if (r.type === 'deco') {
        cls += ' deco'; emoji = DECOS[r.key].emoji; name = DECOS[r.key].name;
        tag = r.dup ? '<span class="dup">重复 +' + DUP_DECO_PTS + '⭐</span>' : '<span class="new">NEW 装饰</span>';
      } else {

      return '<div class="' + cls + '"><div class="ge">' + emoji + '</div>' +
             '<div class="gn">' + name + '</div>' + tag + '</div>';
    }).join('');
    const pets = results.filter(r => r.type === 'pet' && !r.dup).length;
    const decos = results.filter(r => r.type === 'deco').length;
    const wears = results.filter(r => r.type === 'wear').length;
    const foods = results.filter(r => r.type === 'food').length;
    const hasPet = results.some(r => r.type === 'pet');
    const stageData = {
      grid: gridHtml,
      summary: '限定 ' + pets + ' · 佩饰 ' + wears + ' · 装饰 ' + decos + ' · 食物 ' + foods,
      tip: '限定宠物 ' + PET_PCT + '% · 第 ' + state.pulls + ' 抽 · 保底进度 ' +
        state.pity + '/' + PITY_SMALL + '（' + PITY_SMALL + ' 抽必出限定，' + Math.round(SPOOK_AT_PITY * 100) +
        '% 歪星野；' + PITY_BIG + ' 抽必出当期限定）'
    };
    // ① 先出动画：把结果网格清空、只放动画舞台
    const card = el('gachaCard'), stage = el('rollStage'), grid = el('gachaGrid');
    if (rollTimer && typeof clearTimeout === 'function') clearTimeout(rollTimer);
    if (grid) grid.innerHTML = '';
    el('gachaTip').textContent = '';
    el('gachaSummary').textContent = hasPet ? '✨ 有星辉……' : '☁️ 云在飘……';
    if (card && card.classList) card.classList.add('rolling');
    if (stage) {
      stage.innerHTML = '';
      stage.innerHTML = '<span class="roll-hint">' + (hasPet ? '✨ 星 辉 聚 集 ✨' : '☁️ 云 朵 飘 过 ☁️') + '</span>';
      gachaRollFx(hasPet, stage);
    }
    closeOtherPanels('gachaOverlay');                           // 只收起别的弹窗，卡池页面留着继续抽
    el('gachaOverlay').classList.add('open');
    paintUseBar();
    // ② 动画播完 → 结果才出现
    rollTimer = setTimeout(() => { rollTimer = 0; rollReveal(stageData); }, ROLL_MS);
  }
  /* ---- 抽卡动画：出了宠物放彩虹，没出就飘云朵 ---- */
  function gachaRollFx(hasPet, host) {
    const grid = host || el('rollStage') || el('gachaGrid');
    if (!grid) return;
    const box = document.createElement('div');
    box.id = 'rollFx';
    box.className = 'roll-fx' + (hasPet ? ' rainbow' : ' cloud');
    if (hasPet) {
      for (let i = 0; i < 5; i++) {
        const arc = document.createElement('i');
        arc.className = 'arc a' + i;
        box.appendChild(arc);
      }
      const sp = document.createElement('b');
      sp.className = 'sparkle';
      sp.textContent = '✨';
      box.appendChild(sp);
    } else {
      for (let i = 0; i < 3; i++) {
        const cl = document.createElement('i');
        cl.className = 'cl cl' + i;
        box.appendChild(cl);
      }
    }
    grid.insertBefore(box, grid.firstChild);
    if (!host) setTimeout(() => { if (box.parentNode && box.parentNode.removeChild) box.parentNode.removeChild(box); }, 1800);
  }
  let rollTimer = 0;
  const ROLL_MS = 1500;                                        // 动画时长：先飘完，再出结果
  function rollReveal(stageHtml) {

    if (stage) stage.innerHTML = '';
    if (stageHtml) {                                           // 结果在这一刻才出现
      el('gachaGrid').innerHTML = stageHtml.grid;
      el('gachaSummary').textContent = stageHtml.summary;
      el('gachaTip').textContent = stageHtml.tip;
    }
    paintUseBar();
  }
  function closeGacha() { el('gachaOverlay').classList.remove('open'); paintUseBar(); }

  function artThumb(p, size) {
    const sp = spOf(p);
    if (sp.img && imgOK[sp.key]) return '<img src="' + sp.img + '" style="width:' + size + 'px" alt="">';
    return '<canvas class="pthumb" data-sp="' + sp.key + '" data-st="' + stageIdx(p) + '" width="40" height="36"' +
      ' style="width:' + (size || 40) + 'px;height:auto"></canvas>';
  }


  function probeImages() {
    if (typeof Image !== 'function') return;
    Object.keys(SPECIES).forEach(k => {
      const sp = SPECIES[k];
      if (!sp.img) return;
      const im = new Image();
      im.onload  = function () { imgOK[k] = true;  render(); };
      im.onerror = function () { imgOK[k] = false; render(); };
